[build-system]
requires = ["poetry-core>=2.1.2,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Kept in step with .poetry-version by check-version-consistency.sh. The
# pin selects which Poetry CI and the image install; this rejects one that
# cannot read the lock - including on a developer's machine, where no
# repository file can install anything.
requires-poetry = ">=2.5,<3"
name = "backend"
version = "0.1.0"
description = "Backend fastAPI and git services"
authors = ["Cotswoldsmaker <mark@letsdodigital.org>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13.8"
fastapi = "0.141.1"
uvicorn = {extras = ["standard"], version = "0.54.0"}
pydantic = "2.13.5"
sqlalchemy = "2.1.1"
psycopg = {extras = ["binary"], version = ">=3.2,<4.0"}
python-dotenv = "1.2.3"
httpx = "0.28.1"
python-jose = {extras = ["cryptography"], version = ">=3.5.0,<4.0.0"}
# Parsing multipart form bodies, which is how FastAPI receives an
# uploaded file. Needed by the passport evidence route: a blob is
# addressed by the hash of its own bytes, so the bytes come through this
# application rather than going straight to a bucket.
python-multipart = ">=0.0.20,<0.1.0"
argon2-cffi = ">=25.1.0,<25.2.0"
pyotp = ">=2.8.0,<3.0.0"
itsdangerous = ">=2.2.0,<3.0.0"
pydantic-settings = ">=2.10.1,<3.0.0"
alembic = ">=1.16.5,<2.0.0"
pywebpush = ">=2.0.3,<3.0.0"
cryptography = ">=50.0.0,<50.1.0"
fhirclient = ">=4.3.2,<5.0.0"
pyyaml = ">=6.0,<7.0"
# Branded email templates (backend/app/email/). Already present, as a
# dependency of the docs tooling, but emails must not rely on a dev group.
jinja2 = ">=3.1.6,<4.0.0"
slowapi = "^0.1.9"
python-json-logger = "^4.0.0"
google-cloud-storage = ">=3.15.0,<3.16.0"
# Invoking the transcode Cloud Run Job when an upload is linked. The
# backend is the trigger rather than Eventarc, so this is what fires the
# job - see the trigger decision in the video auth gate plan.
google-cloud-run = ">=0.16.1,<0.17.0"
reportlab = ">=5.0.1,<5.1.0"
# Amazon SES in London, which sends every email; see
# docs/docs/plans/2026-10-06-amazon-ses-email-plan.md.
boto3 = ">=1.40.0,<2.0.0"
markdown = ">=3.7,<4.0"
nh3 = "^0.3.4"
email-validator = "^2.3.0"
# libgit2 in-process, for the clinician passport's git-backed record
# store. Not the `git` binary: shelling out needs a binary in the image
# and a subprocess per write, which is where the predecessor project's
# push code stalled. Ships manylinux and macOS wheels, so it adds no
# build dependency to the image.
pygit2 = ">=1.20.0,<1.21.0"

[tool.poetry.group.dev.dependencies]
mypy = "^2.0.0"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
mkdocstrings = {extras = ["python"], version = "^1.0.0"}
mkdocs-material = "^9.6.20"
griffe = "^2.0.0"
mkdocs-gen-files = "^0.6.0"
mkdocs-section-index = "^0.3.10"
types-pyyaml = "^6.0.0"
types-Markdown = "^3.7"
mike = "^2.1.3"
mkdocs-swagger-ui-tag = "^0.8.0"
types-requests = "^2.32.4.20260107"
boto3-stubs = {extras = ["sesv2"], version = ">=1.40.0,<2.0.0"}
schemathesis = "^4.14.3"
hypothesis = "^6.151.10"

[tool.ruff]
target-version = "py313"
line-length = 79
lint.select = ["E", "F", "W", "I", "UP", "B"]
lint.ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.black]
target-version = ["py313"]
line-length = 79

# Read by the "mypy (backend, strict)" pre-commit hook, which runs mypy
# from this folder through Poetry so that it sees these settings and the
# real libraries. For a long time nothing did: the hook ran from the
# repository root, where there is no config, so `strict` was never applied.
#
# No SQLAlchemy plugin. SQLAlchemy 2 is typed without one, and 2.1 no
# longer ships `sqlalchemy.ext.mypy`: naming it here stopped mypy loading
# this file at all.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "scripts"]
# Tests are checked by their own hook, without `strict`.
exclude = ['_test\.py$']

# Libraries that ship no type information. Their names are still checked
# for existing; what they return is treated as untyped.
#
# google-cloud-storage is another, and is not listed, because listing it
# does not help: it sits in a namespace its typed neighbours share, so
# mypy reports `from google.cloud import storage` as a name that does not
# exist and not as a library without types. Each such import carries
# `# type: ignore[attr-defined]` instead.
[[tool.mypy.overrides]]
module = ["fhirclient.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --maxfail=1"
# Two places, one name. A test whose subject is one module sits beside it
# under app/, as <module>_test.py, so the two sort together. A test of a
# rule or a journey that no one module owns is in tests/, as
# <what>_test.py. conftest.py is at backend/, above both, so every test
# sees its fixtures.
#
# Only the suffix is collected. A file named test_<something>.py is not a
# test here and pytest does not look in it, so a source file may start
# with test_ without being run or left out of the production image.
# See docs/docs/plans/2026-10-09-tests-beside-the-source-plan.md.
testpaths = ["tests", "app"]
python_files = ["*_test.py"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "migration: runs Alembic migrations against a real Postgres; run by the alembic_drift_check CI job with '-m migration'",
    "e2e: marks end-to-end tests requiring full stack",
    "pentest: marks security penetration tests (run with '-m pentest')",
    "slow: marks tests that should only run in the heavy tier",
]
