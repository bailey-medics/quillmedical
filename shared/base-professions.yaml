  - id: occupational_therapist
    display_name: "Occupational Therapist"
    description: "HCPC-registered occupational therapist"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - take_informed_consent
      - refer_specialty
      - assess_clinician_passport

  - id: paramedic
    display_name: "Paramedic"
    description: "HCPC-registered paramedic"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - take_informed_consent
      - refer_specialty
      - prescribe_non_controlled  # If independent prescriber
      - certify_fitness_to_work  # If independent prescriber
      - assess_clinician_passport

  # ==========================================================================
  # ADMINISTRATIVE STAFF
  # ==========================================================================

  - id: medical_secretary
    display_name: "Medical Secretary"
    description: "Medical secretarial staff"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records  # For correspondence and administration
      - access_clinic_admin

  - id: receptionist
    display_name: "Receptionist"
    description: "Front desk and reception staff"
    requires_clinical_services: true
    base_competencies:
      - access_clinic_admin

  - id: clinic_manager
    display_name: "Clinic Manager"
    description: "Clinic management and operations staff"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records  # For service delivery oversight
      - access_clinic_admin
      - manage_users  # Staff account management
      - manage_staff_membership
      - manage_practising_competencies

  # Whose caseload an organisation carries, as opposed to how a clinic is
  # run day to day. Deliberately thin: it exists so that
  # manage_patient_membership has a holder, and the name is a placeholder
  # for a role nobody has described yet — there is no organisation-level
  # administrator among the other professions, only clinic-level ones and
  # IT. Revisit when real patients make the shape of the job apparent.
  - id: patient_manager
    display_name: "Patient Manager"
    description: "Manages which patients an organisation cares for"
    requires_clinical_services: true
    base_competencies:
      - manage_patient_membership

  - id: system_administrator
    display_name: "System Administrator"
    description: "IT system administrator with technical access"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records  # Technical support only
      - access_clinic_admin
      - manage_users
      - manage_staff_membership
      - manage_practising_competencies

  # ==========================================================================
  # SUPERADMIN
  # ==========================================================================

  # The profession a superadmin is provisioned with, so that operating
  # Quill grants its competencies through the same mechanism as every
  # other role rather than by a rank check inside each gate.
  #
  # Without it the column default applies and a superadmin is created as
  # a *patient* — holding access_patient_records and not manage_users,
  # which is both too much and too little. A gate asking for manage_users
  # would then refuse the one role meant to reach everything.
  #
  # Someone promoted to superadmin who already has a profession keeps it,
  # and gains these competencies alongside. Overwriting would strip a
  # consultant of their clinical competencies the moment someone made
  # them an operator.
  #
  # Deliberately narrow. It carries no clinical competency: a superadmin
  # who needs to read a patient record is granted that like anyone else.
  # See "A superadmin is not a clinician" in
  # docs/docs/plans/2026-09-09-platform-role-plan.md.
  - id: superadmin_profession
    display_name: "Superadmin"
    description: "Operates Quill itself; no clinical access by default"
    requires_clinical_services: false
    base_competencies:
      - manage_users
      - manage_staff_membership
      - manage_practising_competencies

  # ==========================================================================
  # TEACHING PROFESSIONS
  # ==========================================================================

  - id: teaching_delegate
    display_name: "Teaching delegate"
    description: "External delegate with teaching assessment access only (no clinical access)"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_cases

  - id: teaching_clinical_lead
    display_name: "Teaching clinical lead"
    description: "Clinical lead participating in teaching assessments (no additional platform permissions)"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_cases

  - id: teaching_admin
    display_name: "Teaching admin"
    description: "Teaching content manager and assessment coordinator"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_cases
      - manage_teaching_content
      - view_teaching_analytics

  # Teaching admin plus the people: this is the profession that
  # provisions delegates at its own organisation or site. manage_users is
  # the root competency — it can mint any other, including itself — so it
  # is deliberately not on teaching_admin, who curates content rather
  # than accounts. See shared/competency-definitions/admin.yaml.
  - id: teaching_manager
    display_name: "Teaching manager"
    description: "Teaching coordinator who also provisions delegates at their own organisation or site"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_cases
      - manage_teaching_content
      - view_teaching_analytics
      - manage_users
      - manage_staff_membership
      - manage_practising_competencies

  # ==========================================================================
  # EXTERNAL ASSESSORS
  # ==========================================================================

  # A consultant from another trust, invited by a holder to sign off one
  # of their competencies. They do not work here and must not be made
  # staff of a trust they have no relationship with, so this profession
  # is the whole grant: it carries access to the passport and nothing
  # else — no patient records, no clinical actions, no teaching.
  #
  # Only ever assigned to a *new* account accepting an invitation. All
  # fourteen clinical professions already carry
  # assess_clinician_passport, so a consultant who already uses Quill
  # keeps the profession they have; what they may act on is resolved
  # from the passport_signoff_request rows naming them, not from here.
  #
  # requires_clinical_services is false: a passport is a record of a
  # clinician's own competence, with no patient data in it, so an
  # assessor needs nothing clinical switched on to do their part.
  # ==========================================================================
  # EXTERNAL, PER-PATIENT
  # ==========================================================================

  # Invited to one patient's record and no further. Both were accepted by
  # the invite route and written to base_profession long before they
  # existed here, and an unknown id resolves to no competencies at all
  # without complaint — so an accepted invite made an account holding
  # nothing. Their reach is the ExternalPatientAccess row, which names
  # the patient; the competency names what they may do with it.

  - id: patient_advocate
    display_name: "Patient advocate"
    description: "Family member or representative invited to a patient's record"
    requires_clinical_services: true
    base_competencies:
      - access_granted_patient_records

  - id: external_hcp
    display_name: "External healthcare professional"
    description: "Clinician from elsewhere, invited to a single patient's record"
    requires_clinical_services: true
    base_competencies:
      - access_granted_patient_records

  - id: external_assessor
    display_name: "External assessor"
    description: "Clinician from elsewhere, invited to sign off a competency; passport access only"
    requires_clinical_services: false
    base_competencies:
      - assess_clinician_passport
