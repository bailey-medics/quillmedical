# shared/base-professions.yaml
#
# BASE PROFESSION DEFINITIONS
#
# Each base profession represents a job role with a standard set of competencies.
# Individual users can have additional competencies added or removed based on
# their specific training, qualifications, and organisational needs.
#
# Final user competencies = base_profession competencies + additional - removed
#
base_professions:
  # ==========================================================================
  # PATIENT / PUBLIC
  # ==========================================================================

  - id: patient
    display_name: "Patient"
    description: "Member of the public with patient account (no clinical access)"
    requires_clinical_services: true
    base_competencies:
      # Their own record and nothing else. This was
      # access_patient_records, commented "Own records only (filtered by
      # system)" – a comment explaining that the competency did not mean
      # what it said, because eighteen staff professions held the same id
      # to mean a caseload.
      - access_own_patient_records

  # ==========================================================================
  # MEDICAL DOCTORS
  # ==========================================================================

  - id: foundation_year_1
    display_name: "Foundation Year 1 Doctor (FY1)"
    description: "Newly qualified doctor in first year of foundation training"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - request_plain_xray
      - take_informed_consent
      - refer_specialty
      - prescribe_non_controlled
      - certify_fitness_to_work
      - assess_clinician_passport

  - id: foundation_year_2
    display_name: "Foundation Year 2 Doctor (FY2)"
    description: "Doctor in second year of foundation training"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - request_plain_xray
      - request_ct_scan
      - request_mri_scan
      - take_informed_consent
      - refer_specialty
      - admit_patient
      - prescribe_non_controlled
      - prescribe_controlled_schedule_3_4_5
      - certify_fitness_to_work
      - certify_death  # After training
      - assess_clinician_passport

  - id: specialty_trainee_1_2
    display_name: "Specialty Trainee Year 1-2 (ST1-2)"
    description: "Doctor in early specialty training"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - request_plain_xray
      - request_ct_scan
      - request_mri_scan
      - take_informed_consent
      - assess_mental_capacity
      - refer_specialty
      - admit_patient
      - prescribe_non_controlled
      - prescribe_controlled_schedule_3_4_5
      - certify_fitness_to_work
      - certify_death
      - certify_fitness_to_drive
      - interpret_ecg
      - assess_clinician_passport

  - id: specialty_trainee_3_plus
    display_name: "Specialty Trainee Year 3+ (ST3+)"
    description: "Doctor in higher specialty training"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - perform_lumbar_puncture
      - request_plain_xray
      - request_ct_scan
      - request_mri_scan
      - take_informed_consent
      - assess_mental_capacity
      - refer_specialty
      - admit_patient
      - discharge_without_review  # With appropriate experience
      - prescribe_non_controlled
      - prescribe_controlled_schedule_2
      - prescribe_controlled_schedule_3_4_5
      - certify_fitness_to_work
      - certify_death
      - certify_fitness_to_drive
      - approve_clinical_letters
      - interpret_ecg
      - manage_diabetes
      - manage_anticoagulation
      - assess_clinician_passport

  - id: consultant
    display_name: "Consultant"
    description: "Fully qualified specialist consultant"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - perform_lumbar_puncture
      - perform_chest_drain
      - perform_advanced_airway
      - request_plain_xray
      - request_ct_scan
      - request_mri_scan
      - take_informed_consent
      - assess_mental_capacity
      - apply_deprivation_of_liberty
      - refer_specialty
      - admit_patient
      - discharge_without_review
      - prescribe_non_controlled
      - prescribe_controlled_schedule_2
      - prescribe_controlled_schedule_3_4_5
      - certify_fitness_to_work
      - certify_death
      - certify_cremation
      - certify_fitness_to_drive
      - approve_clinical_letters
      - interpret_ecg
      - manage_diabetes
      - manage_anticoagulation
      - assess_clinician_passport

  - id: general_practitioner
    display_name: "General Practitioner (GP)"
    description: "GP partner or salaried GP"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - request_plain_xray
      - request_ct_scan
      - request_mri_scan
      - take_informed_consent
      - assess_mental_capacity
      - refer_specialty
      - prescribe_non_controlled
      - prescribe_controlled_schedule_2
      - prescribe_controlled_schedule_3_4_5
      - certify_fitness_to_work
      - certify_death
      - certify_fitness_to_drive
      - approve_clinical_letters
      - interpret_ecg
      - assess_clinician_passport

  # ==========================================================================
  # NURSING STAFF
  # ==========================================================================

  - id: registered_nurse
    display_name: "Registered Nurse (RN)"
    description: "NMC-registered nurse (adult, paediatric, mental health, learning disability)"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - take_informed_consent
      - refer_specialty
      - certify_fitness_to_work  # If independent prescriber
      - assess_clinician_passport

  - id: advanced_nurse_practitioner
    display_name: "Advanced Nurse Practitioner (ANP)"
    description: "Advanced clinical practitioner with extended responsibilities"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - request_plain_xray
      - take_informed_consent
      - assess_mental_capacity
      - refer_specialty
      - prescribe_non_controlled  # If independent prescriber
      - prescribe_controlled_schedule_3_4_5  # If independent prescriber
      - certify_fitness_to_work
      - approve_clinical_letters
      - assess_clinician_passport

  - id: healthcare_assistant
    display_name: "Healthcare Assistant (HCA)"
    description: "Unregistered nursing assistant"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - perform_venepuncture  # After competency training
      - assess_clinician_passport

  # ==========================================================================
  # PHARMACY STAFF
  # ==========================================================================

  - id: pharmacist
    display_name: "Pharmacist"
    description: "GPhC-registered pharmacist"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - prescribe_non_controlled  # If independent prescriber
      - prescribe_controlled_schedule_3_4_5  # If independent prescriber
      - certify_fitness_to_work  # If independent prescriber
      - assess_clinician_passport

  - id: pharmacy_technician
    display_name: "Pharmacy Technician"
    description: "GPhC-registered pharmacy technician"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - assess_clinician_passport

  # ==========================================================================
  # ALLIED HEALTH PROFESSIONALS
  # ==========================================================================

  - id: physiotherapist
    display_name: "Physiotherapist"
    description: "HCPC-registered physiotherapist"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - request_plain_xray  # Extended scope
      - take_informed_consent
      - refer_specialty
      - certify_fitness_to_work  # If independent prescriber
      - assess_clinician_passport

  - id: occupational_therapist
    display_name: "Occupational Therapist"
    description: "HCPC-registered occupational therapist"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - take_informed_consent
      - refer_specialty
      - assess_clinician_passport

  - id: paramedic
    display_name: "Paramedic"
    description: "HCPC-registered paramedic"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records
      - modify_patient_records
      - perform_venepuncture
      - perform_cannulation
      - take_informed_consent
      - refer_specialty
      - prescribe_non_controlled  # If independent prescriber
      - certify_fitness_to_work  # If independent prescriber
      - assess_clinician_passport

  # ==========================================================================
  # ADMINISTRATIVE STAFF
  # ==========================================================================

  - id: medical_secretary
    display_name: "Medical Secretary"
    description: "Medical secretarial staff"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records  # For correspondence and administration
      - access_clinic_admin

  - id: receptionist
    display_name: "Receptionist"
    description: "Front desk and reception staff"
    requires_clinical_services: true
    base_competencies:
      - access_clinic_admin

  - id: clinic_manager
    display_name: "Clinic Manager"
    description: "Clinic management and operations staff"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records  # For service delivery oversight
      - access_clinic_admin
      - manage_users  # Staff account management
      - manage_staff_membership
      - manage_practising_competencies

  # Whose caseload an organisation carries, as opposed to how a clinic is
  # run day to day. Deliberately thin: it exists so that
  # manage_patient_membership has a holder, and the name is a placeholder
  # for a role nobody has described yet – there is no organisation-level
  # administrator among the other professions, only clinic-level ones and
  # IT. Revisit when real patients make the shape of the job apparent.
  - id: patient_manager
    display_name: "Patient Manager"
    description: "Manages which patients an organisation cares for"
    requires_clinical_services: true
    base_competencies:
      - manage_patient_membership

  - id: system_administrator
    display_name: "System Administrator"
    description: "IT system administrator with technical access"
    requires_clinical_services: true
    base_competencies:
      - access_patient_records  # Technical support only
      - access_clinic_admin
      - manage_users
      - manage_staff_membership
      - manage_practising_competencies

  # ==========================================================================
  # SUPERADMIN
  # ==========================================================================

  # The profession a superadmin is provisioned with, so that operating
  # Quill grants its competencies through the same mechanism as every
  # other role rather than by a rank check inside each gate.
  #
  # Without it the column default applies and a superadmin is created as
  # a *patient* – holding access_patient_records and not manage_users,
  # which is both too much and too little. A gate asking for manage_users
  # would then refuse the one role meant to reach everything.
  #
  # Someone promoted to superadmin who already has a profession keeps it,
  # and gains these competencies alongside. Overwriting would strip a
  # consultant of their clinical competencies the moment someone made
  # them an operator.
  #
  # Deliberately narrow. It carries no clinical competency: a superadmin
  # who needs to read a patient record is granted that like anyone else.
  # See "A superadmin is not a clinician" in
  # docs/docs/plans/2026-09-09-platform-role-plan.md.
  - id: superadmin_profession
    display_name: "Superadmin"
    description: "Operates Quill itself; no clinical access by default"
    requires_clinical_services: false
    base_competencies:
      - manage_users
      - manage_staff_membership
      - manage_practising_competencies

  # ==========================================================================
  # TEACHING PROFESSIONS
  # ==========================================================================

  - id: teaching_delegate
    display_name: "Teaching delegate"
    description: "External delegate with teaching assessment access only (no clinical access)"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_results
      - take_teaching_modules

  - id: teaching_clinical_lead
    display_name: "Teaching clinical lead"
    description: "Clinical lead participating in teaching assessments (no additional platform permissions)"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_results
      - take_teaching_modules

  # Runs teaching at an organisation or site: curates the question banks
  # and signs up the delegates who sit them. manage_teaching carries both,
  # and its holder may grant only the teaching competencies and give only
  # the teaching professions, so this profession cannot hand out anything
  # clinical. It replaced teaching_manager, which did the people half
  # through manage_users, the root competency. See
  # docs/docs/plans/2026-09-30-manage-teaching-competency-plan.md.
  - id: teaching_admin
    display_name: "Teaching admin"
    description: "Teaching coordinator who curates content and signs up delegates at their own organisation or site"
    requires_clinical_services: false
    base_competencies:
      - view_teaching_results
      - take_teaching_modules
      - manage_teaching
      - view_teaching_analytics

  # ==========================================================================
  # SAFETY PROFESSIONS
  # ==========================================================================

  # The Safety feature is a mock-up with no backend; these professions
  # exist so it is staffed the way Teaching and Passport are. None needs
  # clinical services: a safety case holds no patient data. See
  # docs/docs/plans/2026-10-02-safety-feature-mock-up-plan.md.

  # The clinical safety officer: writes and reads the safety cases.
  - id: safety_officer
    display_name: "Safety officer"
    description: "Clinical safety officer who works on safety cases (no clinical access)"
    requires_clinical_services: false
    base_competencies:
      - view_safety_cases

  # A label, as the teaching and passport clinical leads are: it names
  # the clinician who leads clinical safety at their org unit and grants
  # nothing an officer does not have.
  - id: safety_clinical_lead
    display_name: "Safety clinical lead"
    description: "Named clinician leading clinical safety at their organisation or site"
    requires_clinical_services: false
    base_competencies:
      - view_safety_cases

  # Runs safety at their organisation or site: takes on officers and
  # names the clinical lead, within manage_safety's whitelist. Opens the
  # cases as well, so the admin sees what they are signing people up to.
  - id: safety_admin
    display_name: "Safety admin"
    description: "Runs the Safety feature at their organisation or site and signs up the people in it"
    requires_clinical_services: false
    base_competencies:
      - view_safety_cases
      - manage_safety

  # ==========================================================================
  # EXTERNAL, PER-PATIENT
  # ==========================================================================

  # Invited to one patient's record and no further. Both were accepted by
  # the invite route and written to base_profession long before they
  # existed here, and an unknown id resolves to no competencies at all
  # without complaint – so an accepted invite made an account holding
  # nothing. Their reach is the ExternalPatientAccess row, which names
  # the patient; the competency names what they may do with it.

  - id: patient_advocate
    display_name: "Patient advocate"
    description: "Family member or representative invited to a patient's record"
    requires_clinical_services: true
    base_competencies:
      - access_granted_patient_records

  - id: external_hcp
    display_name: "External healthcare professional"
    description: "Clinician from elsewhere, invited to a single patient's record"
    requires_clinical_services: true
    base_competencies:
      - access_granted_patient_records

  # ==========================================================================
  # PASSPORT PROFESSIONS
  # ==========================================================================

  # Hold a passport of their own and sign off other people's. The one
  # competency does both today: assess_clinician_passport is what opens the
  # passport at all. Writing to their own passport is not here, because
  # passport_write is sold – it comes from the organisation enabling it or
  # an individual subscription. One profession carries it, passport_admin.
  - id: passport_delegate
    display_name: "Passport delegate"
    description: "Holds a clinician passport and signs off other people's competencies"
    requires_clinical_services: false
    base_competencies:
      - assess_clinician_passport

  # A label, as teaching_clinical_lead is beside teaching_delegate: it names
  # the clinician who leads the passport at their org unit and grants
  # nothing a delegate does not have.
  - id: passport_clinical_lead
    display_name: "Passport clinical lead"
    description: "Named clinician leading the passport at their organisation or site"
    requires_clinical_services: false
    base_competencies:
      - assess_clinician_passport


  # Runs the passport at their organisation or site: takes on delegates,
  # names the clinical lead and invites external assessors, within
  # manage_passport's whitelist.
  #
  # It opens the passport as well, through assess_clinician_passport: a
  # perk of the job, and the admin sees what they are signing people up
  # to. It began without it, on the reasoning that running the scheme is
  # not holding a passport. But an admin is a member of the place they
  # run, so its cover gave them passport_write, and writing with no way
  # in was a paid grant nobody could use.
  #
  # It holds passport_write too, and is the only profession that does.
  # An admin may give writing to anybody at their org units but
  # themselves, because nobody changes their own competencies. So without
  # this, an admin at a place with no cover switched on needed a second
  # admin before they could use the thing they run. A deliberate
  # exception to "writing is sold", made for the few people who run it.
  - id: passport_admin
    display_name: "Passport admin"
    description: "Runs the passport at their organisation or site, signs up the people in it and holds a passport of their own"
    requires_clinical_services: false
    base_competencies:
      - manage_passport
      - assess_clinician_passport
      - passport_write

  # A consultant from another trust, invited by a holder to sign off one
  # of their competencies. They do not work here and must not be made
  # staff of a trust they have no relationship with, so this profession
  # is the whole grant: it carries access to the passport and nothing
  # else – no patient records, no clinical actions, no teaching.
  #
  # Only ever assigned to a *new* account accepting an invitation. All
  # fourteen clinical professions already carry
  # assess_clinician_passport, so a consultant who already uses Quill
  # keeps the profession they have; what they may act on is resolved
  # from the passport_signoff_request rows naming them, not from here.
  #
  # requires_clinical_services is false: a passport is a record of a
  # clinician's own competence, with no patient data in it, so an
  # assessor needs nothing clinical switched on to do their part.
  - id: passport_external_assessor
    display_name: "Passport external assessor"
    description: "Clinician from elsewhere, invited to sign off a competency; passport access only"
    requires_clinical_services: false
    base_competencies:
      - assess_clinician_passport
