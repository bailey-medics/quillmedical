# shared/competency-definitions/clinical.yaml
#
# GENERAL CLINICAL SKILLS - QUILL MEDICAL
#
# A framework Quill Medical publishes itself, so that a clinician can
# record everyday skills such as venepuncture in their passport: the
# passport offers only what a holder's frameworks contain. Quill may
# publish a framework like anybody else. It names no specialty, because
# these belong to every one.
#
# FRAMEWORK COMPETENCIES ARE CONTENT, NOT PERMISSIONS
#
# Every entry here is recorded in a passport and granted to nobody: the
# loader refuses each one wherever a competency is granted, as it does
# every framework's. The permissions of the same names, which the code
# checks, live in clinical-permissions.yaml. Until 2 November 2026 the
# two shared one id each; see
# docs/docs/plans/2026-11-01-passport-record-and-catalogue-plan.md.
#
# Every id starts with this framework's id and an underscore,
# `clinical_`, as every framework's must. Ids are unique across the whole
# directory, so the same act under two frameworks is two competencies.
#
# A competency is retired with `retired_on`, never deleted, so a record
# against it still opens. Rewording one is allowed only where the meaning
# is unchanged; a change of meaning is a new id.

framework:
  id: clinical
  name: "General clinical skills"
  publisher: "Quill Medical"
  version: "2026"
  specialties: []

competencies:
  # ==========================================================================
  # PRESCRIBING
  # ==========================================================================

  - id: clinical_prescribe_non_controlled
    display_name: "Prescribe Non-Controlled Medications"
    assessable: true

  - id: clinical_prescribe_controlled_schedule_2
    display_name: "Prescribe Schedule 2 Controlled Drugs"
    assessable: true

  - id: clinical_prescribe_controlled_schedule_3_4_5
    display_name: "Prescribe Schedule 3/4/5 Controlled Drugs"
    assessable: true

  # ==========================================================================
  # CERTIFICATION AND DEATH
  # ==========================================================================

  - id: clinical_certify_death
    display_name: "Certify Death"
    assessable: true

  - id: clinical_certify_cremation
    display_name: "Certify Cremation (Cremation Form 4/5)"
    assessable: true

  - id: clinical_certify_fitness_to_work
    display_name: "Certify Fitness to Work (Fit Notes)"
    assessable: true

  - id: clinical_certify_fitness_to_drive
    display_name: "Certify Fitness to Drive"
    assessable: true

  # ==========================================================================
  # CLINICAL PROCEDURES
  # ==========================================================================

  - id: clinical_perform_venepuncture
    display_name: "Perform Venepuncture"
    assessable: true

  - id: clinical_perform_cannulation
    display_name: "Insert Intravenous Cannula"
    assessable: true

  - id: clinical_perform_lumbar_puncture
    display_name: "Perform Lumbar Puncture"
    assessable: true

  - id: clinical_perform_chest_drain
    display_name: "Insert Chest Drain"
    assessable: true

  - id: clinical_perform_advanced_airway
    display_name: "Perform Advanced Airway Management"
    assessable: true

  # ==========================================================================
  # CONSENT AND MENTAL CAPACITY
  # ==========================================================================

  - id: clinical_take_informed_consent
    display_name: "Take Informed Consent"
    assessable: true

  - id: clinical_assess_mental_capacity
    display_name: "Assess Mental Capacity"
    assessable: true

  - id: clinical_apply_deprivation_of_liberty
    display_name: "Apply Deprivation of Liberty Safeguards (DoLS)"
    assessable: true

  # ==========================================================================
  # SPECIALTY PRACTICE
  # ==========================================================================

  - id: clinical_manage_diabetes
    display_name: "Manage Diabetes (Specialty)"
    assessable: true

  - id: clinical_manage_anticoagulation
    display_name: "Manage Anticoagulation Therapy"
    assessable: true

  - id: clinical_interpret_ecg
    display_name: "Interpret ECGs Independently"
    assessable: true
