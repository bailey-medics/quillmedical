  # Levels are the RCR entrustment scale, verbatim.

  - id: define_radiotherapy_target_volume
    display_name: "Interpret imaging for target volume and organ-at-risk definition"
    retired_on: 2026-10-07
    assessable: true
    levels:
      - id: observe_only
        name: "Entrusted to observe only"
      - id: direct_supervision
        name: "Entrusted to act with direct supervision"
      - id: indirect_supervision
        name: "Entrusted to act with indirect or minimal supervision"
      - id: unsupervised
        name: "Entrusted to act unsupervised"

  - id: deliver_radical_radiotherapy
    display_name: "Deliver and manage radical and combined modality radiotherapy"
    retired_on: 2026-10-07
    assessable: true
    levels:
      - id: observe_only
        name: "Entrusted to observe only"
      - id: direct_supervision
        name: "Entrusted to act with direct supervision"
      - id: indirect_supervision
        name: "Entrusted to act with indirect or minimal supervision"
      - id: unsupervised
