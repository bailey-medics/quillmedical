      - id: observe_only
        name: "Entrusted to observe only"
      - id: direct_supervision
        name: "Entrusted to act with direct supervision"
      - id: indirect_supervision
        name: "Entrusted to act with indirect or minimal supervision"
      - id: unsupervised
        name: "Entrusted to act unsupervised"

  - id: deliver_radioisotope_therapy
    display_name: "Deliver unsealed source radioisotope therapy"
    retired_on: 2026-10-07
    assessable: true
    levels:
      - id: observe_only
        name: "Entrusted to observe only"
      - id: direct_supervision
        name: "Entrusted to act with direct supervision"
      - id: indirect_supervision
        name: "Entrusted to act with indirect or minimal supervision"
      - id: unsupervised
        name: "Entrusted to act unsupervised"

  - id: manage_brachytherapy_patients
    display_name: "Manage patients treated with brachytherapy"
    retired_on: 2026-10-07
    assessable: true
    levels:
      - id: observe_only
        name: "Entrusted to observe only"
      - id: direct_supervision
        name: "Entrusted to act with direct supervision"
      - id: indirect_supervision
        name: "Entrusted to act with indirect or minimal supervision"
      - id: unsupervised
        name: "Entrusted to act unsupervised"

  # ==========================================================================
  # ACUTE ONCOLOGY
  # ==========================================================================
