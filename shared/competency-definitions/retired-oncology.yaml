# shared/competency-definitions/retired-oncology.yaml
#
# RETIRED: THE FIRST ONCOLOGY COMPETENCIES
#
# The proof-of-concept oncology list the clinician passport began with,
# drafted from two national frameworks before any real sign-off document
# was to hand. It was replaced on 7 October 2026 by frameworks written
# from the documents themselves: uk_sact_board_2023.yaml,
# ruh_sact_passport.yaml and ghnft_radiotherapy_record.yaml.
#
# RETIRED, NOT DELETED
#
# A passport already holding a sign-off, a logbook entry or a certificate
# against one of these must still open, and the passport raises on an id
# the catalogue has never defined. So each entry stays, with `retired_on`:
# readable for ever, and offered for nothing new. Their levels and scopes
# stay too, so an old record still reads in the words it was signed under.
#
# This file declares no framework. Its entries belong to none, which is
# allowed only because they are retired.
#
# See docs/docs/plans/2026-10-07-passport-registrar-portfolios-plan.md.

competencies:
  # ==========================================================================
  # SYSTEMIC ANTI-CANCER THERAPY (SACT)
  # ==========================================================================
  #
  # Levels are the UK SACT Board's four, verbatim. Note that the Board
  # recommends who may assess each level – Level 2 by a practitioner at
  # Level 3 or above, Levels 3 and 4 by one at Level 4 or above. Quill
  # records that judgement rather than enforcing it, exactly as the
  # paper passport does: the record names the assessor, their role and
  # their registration, so a reader can weigh it. See the passport plan
  # for why.

  - id: prescribe_sact
    display_name: "Review and prescribe systemic anti-cancer therapy"
    retired_on: 2026-10-07
    assessable: true
    levels:
      - id: observation_only
        name: "Observation only"
      - id: review_and_authorise
        name: "Review and authorise administration"
      - id: prescribe_subsequent_cycles
        name: "Prescribe second cycle onwards"
      - id: prescribe_first_cycle
        name: "Prescribe first cycle"
    # The Board recommends a declaration for each tumour type somebody
    # prescribes for, so a sign-off says which. A first draft of the
    # list, for an oncologist to correct. `other` is required on every
    # list, so nobody is blocked by a missing entry.
    scopes:
      - id: breast
        name: "Breast"
      - id: lung
        name: "Lung"
      - id: upper_gastrointestinal
        name: "Upper gastrointestinal"
      - id: lower_gastrointestinal
        name: "Lower gastrointestinal"
      - id: urological
        name: "Urological"
      - id: gynaecological
        name: "Gynaecological"
      - id: head_and_neck
        name: "Head and neck"
      - id: central_nervous_system
        name: "Central nervous system"
      - id: skin
        name: "Skin"
      - id: sarcoma
        name: "Sarcoma"
      - id: haematological
        name: "Haematological"
      - id: unknown_primary
        name: "Cancer of unknown primary"
      - id: other
        name: "Other"

  - id: assess_sact_toxicity
    display_name: "Assess and grade SACT toxicity"
    retired_on: 2026-10-07
    assessable: true

  - id: manage_sact_complications
    display_name: "Manage complications of systemic anti-cancer therapy"
    retired_on: 2026-10-07
    assessable: true

  # ==========================================================================
  # RADIOTHERAPY
  # ==========================================================================
