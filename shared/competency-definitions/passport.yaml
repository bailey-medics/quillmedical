# shared/competency-definitions/passport.yaml
#
# CLINICIAN PASSPORT COMPETENCY DEFINITIONS FOR QUILL MEDICAL
#
# Competencies governing the clinician passport — the portable record of
# what a person has been assessed as competent to do, who signed each
# sign-off, when, and on what evidence.
#
# Feature-admin in kind, like the teaching set in teaching.yaml:
# these say who may use a part of Quill, never what may be done in the
# care of a patient. The competencies a passport *records* are clinical
# and live in clinical.yaml; this file holds only the gate on the
# feature itself.
#
# Every file in this directory is merged into one catalogue at load
# time, so ids must be unique across the whole directory, not just
# within a file. Which file an entry lives in carries no meaning to the
# code — it is for the reader.

competencies:
  # Two competencies, because assessing and holding have opposite
  # economics once the passport is sold. Assessing is a favour to
  # somebody else's record: the holder's organisation gets the benefit
  # and the assessor gets nothing, so an assessor who meets a price
  # simply declines and the holder cannot be signed off at all. Holding
  # is the product.
  #
  # This is NOT a seniority split, which an earlier single competency
  # was right to refuse: a consultant of thirty years still needs new
  # competencies signed off, and a registrar signed off for a procedure
  # last year is often the right person to sign off a junior this year.
  # Both competencies are held by most clinicians at a paying
  # organisation, and neither implies the other is beneath it.
  #
  # What constrains a sign-off is still not a flag here: self-sign-off
  # is refused at the API, and that remains the only hard rule.

  # Retired on 21 September 2026, superseded by the two below. It was
  # one competency doing two jobs: reaching the passport at all, and
  # holding one of your own. Those are the same thing only while the
  # passport is free.
  #
  # Kept rather than deleted because deleting revokes nothing. Anybody
  # holding it keeps whatever it granted, and the id stops being
  # describable — which is what an audit trail needs in order to say
  # what somebody was authorised to do at the time.
  - id: access_clinician_passport
    display_name: "Use the Clinician Passport"
    retired_on: 2026-09-21

  # Free, and granted by base profession at provisioning. An assessor
  # must never meet a price or a lapse, because a wall here stalls
  # somebody else's sign-off and breaks the clinical workflow to
  # protect revenue.
  - id: assess_clinician_passport
    display_name: "Sign Off Clinician Passport Competencies"

  # The product. Deliberately granted by NO base profession: it comes
  # from an organisation's enablement or an individual subscription,
  # and nowhere else. A profession granting it would hand every
  # clinician the paid feature at provisioning and make the split
  # cosmetic.
  #
  # It gates writing only. Reading and exporting a passport you already
  # hold are derived from owning it, never from paying, so a lapsed
  # holder keeps their record in full and loses only the ability to add
  # to it.
  - id: passport_write
    display_name: "Hold and Write a Clinician Passport"
