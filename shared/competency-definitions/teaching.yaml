# shared/competency-definitions/teaching.yaml
#
# TEACHING COMPETENCY DEFINITIONS FOR QUILL MEDICAL
#
# Competencies governing the teaching feature – who may take an
# assessment, curate the content behind it, and read the analytics it
# produces.
#
# These say who may use a part of Quill, never what may be done in the
# care of a patient. The clinical set lives in clinical.yaml.
#
# Every file in this directory is merged into one catalogue at load
# time, so ids must be unique across the whole directory, not just
# within a file. Which file an entry lives in carries no meaning to the
# code – it is for the reader.

competencies:
  # The two doors a learner goes through, kept apart so the inner one can
  # be closed and leave the outer one open, as passport_write can lapse
  # and leave the passport readable.
  #
  # The outer door: reaching /teaching, and somebody's own past results
  # and certificates. A certificate records something they did, so it
  # outlives their way into the modules.
  - id: view_teaching_results
    display_name: "View Own Teaching Results"

  # The inner door: entering a module to read its lessons, watch its
  # video and sit its assessment. On its own it reaches nothing, because
  # /teaching is the way in, so the teaching professions carry both.
  - id: take_teaching_modules
    display_name: "Take Teaching Modules"

  # Retired: it was checked on lessons and video only, while its label
  # promised assessments, which nothing checked at all. Split into the
  # two above. Kept so rows and audit entries naming it stay readable.
  # See
  # docs/docs/plans/2026-10-04-teaching-access-results-modules-and-enrolment-plan.md.
  - id: view_teaching_cases
    display_name: "Take Teaching Assessments"
    retired_on: 2026-10-04

  # Retired: manage_teaching covers content and the delegates who sit it.
  # Kept so rows and audit entries naming it stay readable.
  - id: manage_teaching_content
    display_name: "Manage Teaching Content"
    retired_on: 2026-09-30

  - id: view_teaching_analytics
    display_name: "View Teaching Analytics"

  # Running teaching at an organisation or site: curating the question
  # banks, and signing up the delegates who sit them.
  #
  # The people half is what separates this from manage_users. Its holder
  # may grant and remove only what may_grant lists, and give only the
  # professions may_assign_professions lists. It is a whitelist, so a
  # new competency cannot be granted here until somebody adds it. So a
  # teaching coordinator can sign up a delegate and cannot hand out a
  # clinical competency. It is on its own list so one coordinator can
  # appoint another without holding manage_users.
  #
  # Like every competency it answers *what*, never *where*: membership
  # still decides which org_units its holder may act at. See
  # docs/docs/plans/2026-09-30-manage-teaching-competency-plan.md.
  - id: manage_teaching
    display_name: "Manage Teaching"
    may_grant:
      - view_teaching_results
      - take_teaching_modules
      - manage_teaching
      - view_teaching_analytics
    may_assign_professions:
      - teaching_delegate
      - teaching_clinical_lead
      - teaching_admin
