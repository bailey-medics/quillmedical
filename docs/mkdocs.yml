plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../backend
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            members_order: source
            inherited_members: false
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

watch:
  - ../backend
  - docs
