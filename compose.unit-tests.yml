# Throwaway unit-test containers for any worktree.
#
# The dev stack (compose.dev.yml) belongs to the main checkout alone: its
# containers bind-mount that checkout and carry fixed names, so testing
# through `docker exec quill_backend` from another worktree would run the
# main checkout's code. This file sidesteps the stack entirely. `just ub` and
# `just uf` run `docker compose run --rm` against it, so each run is a fresh
# container built from the shared dev image with THIS worktree mounted at /app.
#
# The unit tests need no services: the backend suite uses in-memory SQLite,
# and the frontend suite is vitest under jsdom. Neither talks to Postgres,
# FHIR or EHRbase, so nothing here has a network.
#
# The compose project name is derived from the worktree directory (see
# `_test-project` in the Justfile), which gives every worktree its own
# node_modules volumes and keeps it clear of the dev stack's containers.
#
# Usage (normally via the Justfile):
#   docker compose -p quill-test-<worktree> -f compose.unit-tests.yml run --rm backend pytest -q
#   docker compose -p quill-test-<worktree> -f compose.unit-tests.yml run --rm frontend yarn unit-test:run

services:
  backend:
    # Same image name as compose.dev.yml, so one build serves every worktree
    # and `just se b` refreshes it for all of them.
    image: quill-backend-dev
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: dev
    # No env_file: CI runs the suite with no .env, and conftest.py supplies
    # every value the app needs. Anything set here beats a mounted
    # backend/.env, so a placeholder or a real secret there cannot leak into
    # or break a test run.
    environment:
      BACKEND_ENV: testing
      JWT_SECRET: test_secret_key_long_enough_for_validation_32_chars_min
      CORE_DB_PASSWORD: test_auth_password
      CLINICAL_SERVICES_ENABLED: "false"
      EMAIL_DRY_RUN: "true"
      # Empty, so a development backend/.env limiting who may be emailed
      # does not refuse the addresses the tests use. CI has no .env and
      # passed; locally every passport request test failed with a 400.
      EMAIL_ALLOWED_RECIPIENTS: ""
      # Empty, so a development backend/.env holding an SES key does not
      # send the newsletter tests to Amazon to read its suppression list.
      # With no key there is nobody to ask, as in CI.
      SES_ACCESS_KEY_ID: ""
      SES_SECRET_ACCESS_KEY: ""
      TEACHING_STORAGE_BACKEND: local
    # As the host user on Linux, where the Justfile sets HOST_UID, so the
    # test cache and `just email-preview`'s renders can be written into the
    # worktree. Otherwise the image's own appuser, as before.
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - ./api-compatibility:/api-compatibility
      # The committed email previews: `just email-preview` writes them, and
      # app/email/previews_test.py checks they match the templates.
      - ./frontend/src/stories/emails/rendered:/frontend/src/stories/emails/rendered
    network_mode: none

  frontend:
    image: quill-frontend-dev
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: dev
    environment:
      NODE_ENV: test
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    # Stays root, as the image is, because the node_modules volumes are
    # root's. What a run writes into the worktree is handed back to the host
    # user afterwards instead: see scripts/hand-back-ownership.sh.
    entrypoint: ["sh", "/usr/local/bin/hand-back-ownership.sh", "/app"]
    working_dir: /app
    volumes:
      - ./scripts/hand-back-ownership.sh:/usr/local/bin/hand-back-ownership.sh:ro
      - ./frontend:/app
      # Named volumes are seeded from the image's own node_modules the first
      # time they are created, so a new worktree needs no install step. They
      # are per compose project, hence per worktree. When package.json
      # changes on a branch, `just utr` throws them away and rebuilds.
      - node_modules:/app/node_modules
      - public_pages_node_modules:/app/public_pages/node_modules
      - ./shared:/shared
    network_mode: none

  # The alert watcher in scripts/alert-watcher/, a Node program of its own
  # that runs on the home box. The frontend image is borrowed only for its
  # Node 26 and Yarn: nothing of the frontend is mounted. Its one test that
  # reads outside its folder checks the alert policies in main.tf, so that
  # folder alone is mounted beside it, read-only. It has a network, unlike
  # the two above, because its packages are installed on each run rather
  # than baked into an image.
  alert-watcher:
    image: quill-frontend-dev
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: dev
    environment:
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    entrypoint: ["sh", "/usr/local/bin/hand-back-ownership.sh", "/repo/scripts/alert-watcher"]
    working_dir: /repo/scripts/alert-watcher
    volumes:
      - ./scripts/hand-back-ownership.sh:/usr/local/bin/hand-back-ownership.sh:ro
      - ./scripts/alert-watcher:/repo/scripts/alert-watcher
      - ./infra/modules/monitoring:/repo/infra/modules/monitoring:ro
      - alert_watcher_node_modules:/repo/scripts/alert-watcher/node_modules

volumes:
  node_modules:
  public_pages_node_modules:
  alert_watcher_node_modules:
