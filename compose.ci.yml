# CI Docker Compose - lightweight stack for E2E (Playwright) tests.
# Excludes clinical services (FHIR, EHRbase) and dev tooling.
# Usage: docker compose -f compose.ci.yml up --build --wait
#
# After services are healthy, run the migrations and scripts/seed_ci.py in
# the backend container, then run Playwright against Caddy.
#
# Also the local end-to-end stack: `just e2e` runs exactly this file, so a
# local run rehearses the CI job rather than the dev stack. To let several
# worktrees run it side by side there are no fixed container names (compose
# scopes them by project, and `just e2e` names the project after the
# worktree) and the published ports are E2E_PORT, default 80 for CI, and
# E2E_PUBLIC_PORT for the public site, default 8081. `just e2e` passes 0 for
# both so Docker picks free ports, then reads them back with
# `docker compose port`.

services:
  backend:
    image: quillmedical-ci_backend:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: prod
    environment:
      # Core DB - individual components (Settings computes the URL)
      CORE_DB_PASSWORD: ci_password
      # Defaults match: CORE_DB_NAME=quill_core, CORE_DB_USER=core_user,
      # CORE_DB_HOST=postgres-core, CORE_DB_PORT=5432
      JWT_SECRET: ci-e2e-jwt-secret-key-minimum-32-chars
      BACKEND_ENV: testing
      CLINICAL_SERVICES_ENABLED: "false"
      TEACHING_STORAGE_BACKEND: local
      TEACHING_QUESTION_BANK_PATH: /teaching-repos
      TEACHING_IMAGES_BASE_URL: /api/teaching/images
      # A transcode and a caption job, so the media gate asks what it asks
      # in App production: a module is hidden until its video is
      # transcoded and a person has read its captions. Names nothing
      # runs: the tests stand in for each job by calling its callback
      # with this token, and seed_ci.py writes what the jobs would for
      # the videos it uploads.
      TEACHING_TRANSCODE_JOB: projects/ci/locations/none/jobs/transcode
      TEACHING_CAPTION_JOB: projects/ci/locations/none/jobs/caption
      TEACHING_TRANSCODE_CALLBACK_TOKEN: ci-transcode-callback-token
      # Starting one of those jobs asks Google for credentials, which
      # first looks for a metadata server. Pointed at a closed port, the
      # look is refused at once instead of waiting out its timeouts.
      GCE_METADATA_IP: 127.0.0.1:1
      GCE_METADATA_HOST: 127.0.0.1:1
      EMAIL_DRY_RUN: "true"
      # Every dry-run email is also written here, so a test can follow
      # the link in an invite. Made writable by
      # .github/scripts/ci/prepare-e2e-mail.sh before the stack starts.
      EMAIL_CAPTURE_DIR: /e2e-mail
      # Where a passport's repository is kept. The default, /data/passports,
      # does not exist in the prod image this stack runs, so the first
      # passport made here failed with "Permission denied".
      PASSPORT_LOCAL_ROOT: /tmp/passports
      # Required by push_send.py (imported unconditionally at startup)
      VAPID_PRIVATE: ci-placeholder-vapid-key-not-real
    volumes:
      - ./backend/scripts/seed_ci.py:/app/scripts/seed_ci.py:ro
      # The guides' own seed, run only when their screenshots are taken
      # (`just guide-screenshots`). The end-to-end tests never run it.
      - ./backend/scripts/seed_guides.py:/app/scripts/seed_guides.py:ro
      # Teaching content for seed_ci.py to sync, fetched by
      # .github/scripts/ci/fetch-e2e-teaching.sh before the stack starts.
      # Writable, because an uploaded video is saved beside the content;
      # that script opens the folder to the backend's own user.
      - ./.e2e-teaching:/teaching-repos
      # The emails the tests read, through e2e/fixtures/mail.ts
      - ./frontend/e2e/.mail:/e2e-mail
    expose:
      - "8000"
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - ci

  frontend:
    image: quillmedical-ci_frontend:latest
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: prod
      args:
        VITE_CLINICAL_SERVICES_ENABLED: "false"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ci

  # The public site, quill-medical.com, which production serves from Cloud
  # Storage. Here so a test can open a public page and follow its buttons
  # into the app. Its own port, E2E_PUBLIC_PORT, default 8081 for CI.
  public:
    image: quillmedical-ci_public:latest
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: public-ci
    ports:
      - "${E2E_PUBLIC_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ci

  postgres-core:
    # The public image unless the variable says otherwise. CI sets it to
    # this repository's own copy in GitHub's registry, where it has one,
    # so it is not turned away by the public registry's limit on callers
    # with no login: see .github/scripts/ci/use-mirrored-images.sh. On a
    # developer's machine the variable is unset and nothing changes.
    #
    # Pinned to a digest, the one compose.dev.yml uses, so the image only
    # changes when a pull request changes it and the mirror copies it then.
    image: ${CI_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}
    environment:
      POSTGRES_DB: quill_core
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: ci_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d quill_core"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - ci

  caddy:
    # As for postgres-core above.
    image: ${CI_CADDY_IMAGE:-public.ecr.aws/docker/library/caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b}
    ports:
      - "${E2E_PORT:-80}:80"
    volumes:
      - ./caddy/ci/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ci

networks:
  ci: {}
