# Enables Dependabot VULNERABILITY ALERTS only — not automated PRs.
# Automated version-bump PRs are handled by Renovate (see renovate.json).
#
# Targets the main branch
#
# Tiering strategy and response policy are documented in renovate.json.

version: 2

updates:
  # Python / Poetry (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    target-branch: "main"

  # JavaScript / TypeScript (frontend via Yarn)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    target-branch: "main"

  # Docker base images (Dockerfiles and Compose services)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    target-branch: "main"

  # Terraform providers (infrastructure/)
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    target-branch: "main"

  # GitHub Actions (pinned action versions in .github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    target-branch: "main"
