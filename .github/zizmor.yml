# Settings for zizmor, the security checker for the GitHub Actions
# workflows. Read by the pre-commit hook, `just check-workflows` and CI,
# each of which passes it with --config so a worktree finds it too.
#
# Audits: https://docs.zizmor.sh/audits/
# Plan: docs/docs/plans/2026-10-30-claude-security-plugin-plan.md, Phase 6

rules:
  # Flags actions/checkout keeping its token on disk for later steps.
  # zizmor rates it lower from checkout v6, and every workflow here is on
  # v7, so it would be 65 findings of little weight.
  artipacked:
    disable: true

  # Every action is pinned by commit, with its version as a comment
  # (`@<sha> # v7.0.1`), because a tag can be moved to other code: that is
  # how the tj-actions/changed-files compromise of March 2025 spread.
  # Renovate keeps the pins current. Quill's own workflows are the one
  # exception: teaching-pipeline.yml runs in the content repositories and
  # calls slack-notify.yml at @main, which a commit pin would freeze.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
        "bailey-medics/quillmedical/*": ref-pin

  # Dependabot here raises vulnerability alerts only
  # (open-pull-requests-limit: 0); Renovate proposes every version bump,
  # and its minimumReleaseAge in renovate.json is the cooldown. (6)
  dependabot-cooldown:
    disable: true

  # `uses: ./...` for an action or workflow in this repository. GitHub's
  # `uses: $/...` form (July 2026) cannot load a file a previous step
  # wrote, and counts as pinned. Off until actionlint accepts it: 1.7.12,
  # pinned in install-actionlint.sh and the newest on 31 October 2026,
  # refuses it. (34)
  self-repository:
    disable: true
