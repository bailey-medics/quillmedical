# GitHub rulesets — change trigger and Slack notification
#
# This workflow fires when infra/github/** files change. It alerts via Slack
# that a manual `terraform apply` is needed to sync the rulesets to GitHub.
#
# Why no automatic apply?
#   The state has been remote since 2026-09-25 (gs://quill-medical-app-
#   terraform-state, prefix terraform/github), so the old first reason, that
#   CI had no state to plan against, no longer holds. The second still does,
#   and it is enough on its own:
#
#   These files define the branch protection that decides what reaches main.
#   Applying them needs a repository-admin token. A token CI holds for that
#   could also switch the protection off, so a workflow able to apply this
#   directory could weaken the checks that guard its own merge. It also
#   exposes an admin-scoped token to every job that can read the secret.
#   Keeping the apply with a person means changing the guard always takes a
#   human with admin rights, not only a merged pull request.
#
# Manual workflow, from any checkout: just terraform-github

name: GitHub rulesets

on:
  push:
    branches: [main]
    paths:
      - "infra/github/**"

permissions:
  contents: read

jobs:
  # ---------- Notify that manual apply is needed ----------
  notify:
    name: Notify
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *⚠️ GitHub rulesets changed — manual terraform apply required*

        Files under `infra/github/` were merged to main. They are applied by a person, never by CI, because they define the branch protection that guards main. Run this from any checkout that is up to date with main; it plans first and asks before applying:

        *Action required:*
        ```
        just terraform-github
        ```

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
