# Framework CI/CD pipeline, called by each framework repository.
#
# Each -framework repository carries one thin caller, which hands this
# workflow its events. It dispatches on them, as the teaching pipeline
# does:
#
#   push to feature/**  → auto-create a draft pull request
#   pull_request        → validate the frameworks, check the version
#                         moved up by one, check branch protection
#   push to main        → start the backend's framework sync, which reads
#                         this repository's history itself
#
# A caller that never starts the sync, such as the testing repository,
# sets start_sync: false and passes no secrets: its pull requests are still
# validated, and a merge to main does nothing more.
#
# Do not rename the jobs. A framework repository's ruleset requires status
# checks called "pipeline / validate" and "pipeline / check-protection",
# composed from the caller's job name plus the job names here, so a rename
# leaves the ruleset waiting for a check that never reports.
#
# See Phase 6 of
# docs/docs/plans/2026-11-01-passport-record-and-catalogue-plan.md.
name: Framework pipeline

on:
  workflow_call:
    inputs:
      start_sync:
        description: "Start the backend's framework sync on a merge to main"
        required: false
        type: boolean
        default: true
    # Optional, so a caller with start_sync false passes none. The deploy
    # job refuses to run without the two it signs in with.
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        description: "The provider the content account signs in through"
        required: false
      GCP_SERVICE_ACCOUNT:
        description: "The content account's email"
        required: false
      SLACK_WEBHOOK_URL:
        description: "Where a failed deploy is reported"
        required: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Auto-create a draft pull request when a feature branch is pushed
  # -------------------------------------------------------------------
  auto-pr:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the frameworks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: framework_content
          persist-credentials: false

      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      # Quill's own script: handles the concurrent-run race, derives a
      # title from the branch, and opens the pull request as a draft.
      - name: Create PR if none exists
        working-directory: framework_content
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../tooling/.github/scripts/auto-pr/create-pr.sh "$GITHUB_REF_NAME"

  # -------------------------------------------------------------------
  # Validate the frameworks on a pull request
  # -------------------------------------------------------------------
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history, so the version check can compare with main.
      - name: Check out the frameworks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: framework_content
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main branch
        working-directory: framework_content
        run: git fetch origin main

      # Only what the loader needs: the cbac package, the paths it reads
      # from, the passport tooling, and shared/ for the specialty list and
      # Quill's permissions. Cone mode brings each parent's own files, the
      # __init__ chain among them.
      - name: Check out the Quill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            backend/app/cbac
            backend/app/features/passport/tooling
            shared

      # Kept between runs as the teaching pipeline keeps it, with the same
      # key: setup-python otherwise downloads the exact version from
      # GitHub's releases on every run, and a 504 from that download fails
      # the check. The cache is the framework repository's own.
      - name: Read the Python version
        id: python_version
        run: |
          echo "version=$(tr -d '[:space:]' < tooling/.python-version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the installed Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.python_version.outputs.version }}
          key: python-install-${{ runner.os }}-${{ runner.arch }}-${{ steps.python_version.outputs.image }}-${{ steps.python_version.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: tooling/.python-version

      # Pinned to the versions in Quill's backend/poetry.lock, which
      # framework-pins.bats checks, so the pull request is validated by
      # the same loader the backend runs.
      - name: Install validator dependencies
        run: python -m pip install pydantic==2.14.2 pyyaml==6.0.3

      - name: Validate the frameworks
        working-directory: tooling/backend
        run: python -m app.features.passport.tooling.validate_frameworks "${GITHUB_WORKSPACE}/framework_content/frameworks"

      # Prints every reworded competency, pass or fail, and fails when a
      # framework changed without its version moving up by exactly one.
      - name: Check each changed framework moved its version up by one
        working-directory: tooling/backend
        run: python -m app.features.passport.tooling.check_framework_version "${GITHUB_WORKSPACE}/framework_content/frameworks" origin/main

  # -------------------------------------------------------------------
  # Check the repository is protected
  # -------------------------------------------------------------------
  check-protection:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      - name: Check for active rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tooling/.github/scripts/teaching-pipeline/check-rulesets.sh "$GITHUB_REPOSITORY"

  # -------------------------------------------------------------------
  # Start the backend's framework sync
  # -------------------------------------------------------------------
  #
  # Nothing is uploaded: the sync job reads every framework repository's
  # history itself, so this run only tells it there is something to read.
  #
  # Does not re-validate: the ruleset requires "pipeline / validate" with
  # strict status checks, so the tree reaching main is the one it passed.
  #
  # Skipped when the caller sets start_sync false, and so is the notice
  # below, which only runs when this job failed.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.start_sync
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      execution: ${{ steps.sync.outputs.execution }}
      log_url: ${{ steps.sync.outputs.log_url }}
    steps:
      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      # The secrets are optional, so a caller that starts the sync but
      # forgot one would otherwise fail inside the sign-in, unexplained.
      - name: Check the sign-in secrets were passed
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: bash tooling/.github/scripts/framework-pipeline/check-sign-in-secrets.sh "$PROVIDER" "$SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The account this run signs in as may start this one job and
      # nothing else, so GitHub holds no credential the live app accepts.
      # The script waits for the job and fails the step if the sync
      # refused a version, naming the execution whose log says why.
      - name: Start the backend framework sync job
        id: sync
        env:
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: bash tooling/.github/scripts/teaching-pipeline/run-sync-job.sh "$SERVICE_ACCOUNT" quill-framework-sync-app

  # -------------------------------------------------------------------
  # Tell someone when a deploy fails
  # -------------------------------------------------------------------
  #
  # Called by full path: this workflow runs under the framework
  # repository, so `./` would look for the file there.
  #
  # The deploy job fails in one of two places, and the notice says which.
  # Its execution output is empty until the sync job has started, so an
  # empty one means it failed before then, signing in or starting the job,
  # and no version was looked at.
  notify-deploy-failure:
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    permissions:
      contents: read # slack-notify checks out Quill's scripts
    uses: bailey-medics/quillmedical/.github/workflows/slack-notify.yml@main
    with:
      channel: app
      text: |
        *❌ Framework deploy failed*

        *Repository:* ${{ github.repository }}
        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>

        *Sync job:* ${{ needs.deploy.outputs.execution != '' && format('<{0}|{1}>', needs.deploy.outputs.log_url, needs.deploy.outputs.execution) || 'not started' }}
        ${{ needs.deploy.outputs.execution != '' && 'The sync job ran and failed. A refused version is named in its log.' || 'The run failed before the sync job started, while signing in to Google or starting the job. The framework version was not looked at. The run says which step failed.' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
