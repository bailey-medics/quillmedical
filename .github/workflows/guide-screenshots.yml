# Retake the in-app guides' screenshots and publish them.
#
# The guides at /guides show screenshots of the application. Taken by hand
# they would be out of date within weeks, so Playwright retakes them after
# each merge that could have changed a screen, from the same seeded stack the
# end-to-end tests drive. Every name in a screenshot is therefore one
# backend/scripts/seed_ci.py made up. See
# docs/docs/plans/2026-10-05-in-app-guides-plan.md.
#
# Deliberately apart from deploy.yml: a screenshot spec that can no longer
# find a button must never block a release. It is still worth reading when it
# fails, because the words of that guide are then out of date too.
#
# Locally the same run is `just guide-screenshots`.
name: Guide screenshots

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # Any screen may be in a guide, so any frontend change may move one.
      - "frontend/src/**"
      - "frontend/e2e/guides/**"
      - "frontend/playwright.guides.config.ts"
      # What the screenshots are of.
      - "backend/scripts/seed_ci.py"
      - "backend/scripts/seed_guides.py"
      - "shared/brand.yaml"
      # How they are taken and published, not just what is in them.
      - ".github/scripts/guide-screenshots/**"
      - ".github/workflows/guide-screenshots.yml"

permissions:
  contents: read
  packages: read # the mirrored Postgres and Caddy images, in GHCR

# One at a time, newest wins: the bucket is mirrored, so two runs finishing
# out of order would leave the older set published.
concurrency:
  group: guide-screenshots
  cancel-in-progress: true

jobs:
  take:
    name: Take screenshots
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A module for the teaching pages to show. seed_ci.py syncs it.
      - name: Fetch E2E teaching content
        run: .github/scripts/ci/fetch-e2e-teaching.sh

      # compose.ci.yml mounts the folder its emails are written to. The
      # guides read none, but the backend still writes them.
      - name: Prepare the E2E mail folder
        run: .github/scripts/ci/prepare-e2e-mail.sh

      # The key pair the tests stand in for the video jobs with. Made per
      # run and never committed; compose.ci.yml mounts the public half.
      - name: Prepare the E2E job key
        run: .github/scripts/ci/prepare-e2e-job-key.sh

      # Postgres and Caddy come from this repository's own copies where it
      # has them, pulled with this login, and not from the public
      # registry, which refuses a runner that asks too often. That
      # refusal failed this workflow on 11 October 2026 with no screen
      # changed. mirror-images.yml makes the copies.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use the mirrored images where they exist
        run: bash .github/scripts/ci/use-mirrored-images.sh "${{ github.repository_owner }}" compose.ci.yml CI_POSTGRES_IMAGE CI_CADDY_IMAGE

      # The Python and Node the images build on, from the mirror too. Amazon's
      # public registry refused the Python image with "Data limit exceeded"
      # on 19 October 2026, failing this workflow with no screen changed.
      - name: Use the mirrored base images
        id: base
        run: bash .github/scripts/ci/use-mirrored-base-images.sh "${{ github.repository_owner }}" backend/Dockerfile frontend/Dockerfile

      # Built here, where ci.yml's end-to-end job pulls images it prebuilt
      # for a pull request: on a push to main there are none to pull. A
      # separate build, because `up --build` cannot be given build arguments.
      - name: Build CI images
        env:
          BUILD_ARGS: ${{ steps.base.outputs.build_args }}
        run: bash .github/scripts/guide-screenshots/build-ci-images.sh compose.ci.yml "$BUILD_ARGS"

      - name: Start CI stack
        run: docker compose -f compose.ci.yml up --wait --wait-timeout 120

      - name: Run database migrations
        run: docker compose -f compose.ci.yml exec -T backend alembic upgrade head

      - name: Seed test data
        run: docker compose -f compose.ci.yml exec -T backend python scripts/seed_ci.py

      # The people and results the screenshots show. Apart from seed_ci.py,
      # which the end-to-end tests count on staying as it is.
      - name: Seed the guides' own data
        run: docker compose -f compose.ci.yml exec -T backend python scripts/seed_guides.py

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # Microsoft's Playwright image, tagged by the version yarn.lock
      # resolved, as ci.yml's end-to-end job uses and for the same reason:
      # it carries the browsers, so nothing is installed here.
      - name: Read Playwright version
        id: playwright_version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pull Playwright image
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" docker pull "mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"

      # --network host so localhost is the CI stack. The runner's own user,
      # so what it writes stays readable by the upload step.
      # The pinned teaching module is mounted at the path `../.e2e-teaching`
      # reaches from /work, as in the E2E job in ci.yml: the module guide
      # works out the last slide from it (`knownSlides` in
      # e2e/fixtures/learning.ts), and without the mount it cannot open the
      # module's content.mdx. Read-only: no guide writes there.
      - name: Take the screenshots
        working-directory: frontend
        run: >-
          docker run --rm --network host --ipc host
          --user "$(id -u):$(id -g)"
          -e CI -e HOME=/tmp
          -v "$PWD:/work" -w /work
          -v "$PWD/../.e2e-teaching:/.e2e-teaching:ro"
          "mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"
          npx playwright test --config playwright.guides.config.ts

      # Which guides may be read without an account, from the registry
      # itself. The upload sorts by it: these guides' pictures go to the
      # public bucket and every other guide's to the private one.
      - name: List the public guides
        working-directory: frontend
        run: npx tsx scripts/list-public-guides.ts > public/guide-assets/public-guides.txt

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guide-assets
          path: frontend/public/guide-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --tail=100

  publish:
    name: Publish to app
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    runs-on: ubuntu-26.04
    needs: take
    # The environment that holds the GCP_* secrets read below, as
    # public-site.yml's deploy job uses. It deploys from main only.
    environment:
      name: app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guide-assets
          path: guide-assets/

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload to GCS
        run: bash .github/scripts/guide-screenshots/upload-to-gcs.sh "${{ secrets.GCP_PROJECT_ID }}"

  notify-failure:
    name: Notify guide screenshots failure
    needs: [take, publish]
    if: ${{ always() && (needs.take.result == 'failure' || needs.publish.result == 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: app
      text: |
        *❌ Guide screenshots failed*

        The guides still show the last set that was published. A screenshot that could not be taken usually means a screen has changed, so that guide's words are probably out of date too.

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
