name: Secret access probe (throwaway)

# Throwaway: proves the plan account cannot read a secret's value. Never
# merged; the branch is deleted once it has run.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/secret-access-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Plan account is refused a secret
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment:
      name: app-plan
      deployment: false
    steps:
      - name: Authenticate to GCP as the plan account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The value goes to /dev/null and is never printed, whatever happens.
      - name: Try to read jwt-secret
        run: |
          set +e

          gcloud secrets versions access latest \
            --secret=jwt-secret \
            --project=quill-medical-app \
            > /dev/null 2> err.txt
          status=$?

          if [ "$status" -eq 0 ]; then
            echo "::error::The plan account READ jwt-secret. The route is still open."
            exit 1
          fi

          if grep -q "PERMISSION_DENIED" err.txt; then
            echo "Refused with PERMISSION_DENIED, as it should be."
            exit 0
          fi

          echo "::error::The read failed, but not with PERMISSION_DENIED:"
          cat err.txt
          exit 1
