# Monthly check on whether the backend can move to the next Python minor.
#
# renovate.json holds each new Python minor behind Dependency Dashboard
# approval until every compiled backend dependency ships a wheel for it.
# Like the TypeScript hold beside it, that has no natural end: nothing in
# Renovate watches for the day it stops being necessary. This does, and
# opens an issue when it has.
#
# It watches the minor after .python-version's, so it never needs editing:
# once the backend moves, it starts watching the next one.
#
# Schedule: the 1st of each month at 09:00 UTC. Wheels for a new minor
# arrive over weeks, not hours, so a monthly look is plenty.
name: Python hold check

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      held_minor:
        description: >-
          Python minor to check instead of the one after .python-version,
          such as 3.14. Use it to rehearse, and confirm the issue this opens
          reads the way you want.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: python-hold-check
  cancel-in-progress: true

jobs:
  check:
    name: Check whether the hold can be lifted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      liftable: ${{ steps.check.outputs.liftable }}
      minor: ${{ steps.check.outputs.minor }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check every compiled dependency for a wheel
        id: check
        env:
          HELD_MINOR: ${{ inputs.held_minor }}
        run: bash .github/scripts/ci/check-python-hold.sh

  # ---------- Raise an issue ----------
  #
  # Only when the hold can actually go. A monthly "still held" issue would
  # be the routine notification people learn to ignore.
  raise-issue:
    name: Raise an issue
    needs: check
    if: ${{ needs.check.outputs.liftable != '' }}
    permissions:
      contents: read
      issues: write # Opens the issue when the hold can go
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Open or find the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ needs.check.outputs.liftable }}
          MINOR: ${{ needs.check.outputs.minor }}
        run: bash .github/scripts/ci/raise-python-hold-issue.sh
