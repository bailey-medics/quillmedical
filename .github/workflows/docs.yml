# Build and deploy documentation to GitHub Pages when relevant files change.
name: Documentation

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "shared/**"
      - ".github/prompts/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  # ---------- Build documentation ----------
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      # ---------- Frontend docs (Node + Yarn) ----------
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        # working-directory: frontend so `corepack install` reads the Yarn version from frontend/package.json
        working-directory: frontend
        run: |
          corepack enable
          corepack install

      - name: Cache Yarn
        id: cache_yarn
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/.yarn/cache
            frontend/.yarn/install-state.gz
            frontend/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock', 'frontend/.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.cache_yarn.outputs.cache-hit != 'true'
        working-directory: frontend
        run: yarn install --immutable

      - name: Cache Storybook build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Generate CBAC & config JSON for TypeScript types from YAML
        working-directory: frontend
        run: yarn generate:types

      - name: Build Storybook static site
        working-directory: frontend
        run: yarn storybook:build

      - name: Build frontend docs
        working-directory: frontend
        run: yarn docs:build

      # ---------- Backend docs (MkDocs via Poetry) ----------
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # backend/.venv is intentionally NOT cached: it symlinks into the ephemeral
      # Python toolcache, and a restored copy segfaults when that interpreter is
      # rebuilt. Cache Poetry's download cache so `poetry install` stays fast.
      - name: Cache Poetry & pip
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-docs-py${{ hashFiles('.python-version') }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-docs-py${{ hashFiles('.python-version') }}-
            ${{ runner.os }}-poetry-

      - name: Install project docs dependencies
        run: |
          python -m pip install -U pip poetry
          poetry config virtualenvs.in-project true
          cd backend
          poetry install --no-interaction --no-ansi --with dev

      - name: Export OpenAPI JSON for docs
        working-directory: backend
        run: poetry run python scripts/dump_openapi.py --dev

      - name: Copy LLM prompts from .github to docs folder
        run: |
          mkdir -p docs/docs/llm/prompts
          cp -r .github/prompts/* docs/docs/llm/prompts/

      - name: Build MkDocs site
        run: |
          cd backend
          poetry run mkdocs build -f ../docs/mkdocs.yml -d ../site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ---------- Deploy to GitHub Pages ----------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # ---------- Slack notification (failure only) ----------
  notify-failure:
    name: Notify docs deploy failure
    needs: [build, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Documentation deploy failed*

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
