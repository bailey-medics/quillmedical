# CI — runs on all non-main branches.
# - Fast tier: runs on every push (lint, typecheck, unit tests, storybook build)
# - Heavy tier: runs on non-draft PRs only (storybook interaction tests, Semgrep, E2E)

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # FAST TIER — runs on every push (github.event_name == 'push')
  # ==========================================================================

  # ---------- Python ----------
  python_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Python ${{ matrix.task }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [pre-commit, unit]

    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
      PIP_CACHE_DIR:   ${{ github.workspace }}/.pip-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # ---- Cache for pre-commit ----
      # .venv is intentionally NOT cached: it symlinks into the ephemeral Python
      # toolcache, and a restored copy segfaults when that interpreter is rebuilt.
      - name: Cache pre-commit & pip (pre-commit)
        if: matrix.task == 'pre-commit'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.PRE_COMMIT_HOME }}
            ${{ env.PIP_CACHE_DIR }}
          key: pc-pre-commit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pc-pre-commit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-
            pc-pre-commit-${{ runner.os }}-

      # ---- pre-commit steps ----
      - name: Ensure venv + pre-commit (pre-commit)
        if: matrix.task == 'pre-commit'
        run: bash .github/scripts/ci/ensure-pre-commit-venv.sh

      - name: Warm pre-commit hooks (pre-commit)
        if: matrix.task == 'pre-commit'
        run: |
          . .venv/bin/activate
          pre-commit install-hooks

      - name: Run pre-commit (pre-commit)
        if: matrix.task == 'pre-commit'
        run: |
          . .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure --color=always

      # ---- Cache for unit tests ----
      # backend/.venv is intentionally NOT cached: it symlinks into the ephemeral
      # Python toolcache, and a restored copy segfaults when that interpreter is
      # rebuilt. Cache Poetry's download cache so `poetry install` stays fast.
      - name: Cache Poetry & pip (unit)
        if: matrix.task == 'unit'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ${{ env.PIP_CACHE_DIR }}
          key: pc-unit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            pc-unit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-
            pc-unit-${{ runner.os }}-

      # ---- Unit test steps ----
      - name: Install Poetry (unit)
        if: matrix.task == 'unit'
        run: |
          python -m pip install -U pip poetry
          poetry config virtualenvs.in-project true


      - name: Install backend deps (unit)
        if: matrix.task == 'unit'
        working-directory: backend
        run: |
          poetry install --with dev --no-interaction --no-ansi

      - name: Checkout teaching-tooling (unit)
        if: matrix.task == 'unit'
        uses: actions/checkout@v7.0.1
        with:
          repository: bailey-medics/teaching-tooling
          path: teaching-tooling

      - name: Pytest (unit)
        if: matrix.task == 'unit'
        working-directory: backend
        env:
          TEACHING_TOOLING_SCRIPTS_PATH: ${{ github.workspace }}/teaching-tooling/scripts
        run: |
          poetry run pytest -q -m "not integration and not e2e" --maxfail=1 --disable-warnings



  # ---------- JS: run multiple tools in parallel via matrix ----------
  typescript_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        task: [eslint, prettier, stylelint, "typecheck:all", "unit-test:run", "storybook:build"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        # working-directory: frontend so `corepack install` reads the Yarn version from frontend/package.json
        working-directory: frontend
        run: |
          corepack enable
          corepack install

      - name: Cache Yarn
        id: cache_yarn
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/.yarn/cache
            frontend/.yarn/install-state.gz
            frontend/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock', 'frontend/.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.cache_yarn.outputs.cache-hit != 'true'
        working-directory: frontend
        run: yarn install --immutable

      - name: Cache Storybook build artifacts
        if: matrix.task == 'storybook:build'
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Cache ESLint
        if: matrix.task == 'eslint'
        uses: actions/cache@v6.1.0
        with:
          path: frontend/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('frontend/**/*.{ts,tsx,js,jsx}', 'frontend/eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run ${{ matrix.task }}
        working-directory: frontend
        run: |
          case "${{ matrix.task }}" in
            eslint)   yarn eslint ;;
            prettier) yarn prettier ;;
            stylelint) yarn stylelint ;;
            "typecheck:all") yarn typecheck:all ;;
            "unit-test:run") yarn unit-test:run ;;
            "storybook:build") yarn storybook:build ;;
          esac



  # ---------- Shell scripts ----------
  shell_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Shell script lint and test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint shell scripts
        run: find .github/scripts -name '*.sh' | xargs shellcheck --source-path=SCRIPTDIR
      - name: Set up bats
        uses: bats-core/bats-action@4.0.0
        with:
          # Only bats core is needed; the tests use no helper libraries.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # 4.0.0 no longer authenticates the download automatically; pass the
          # token to avoid GitHub API rate limits.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run shell script tests
        run: bats --recursive .github/scripts


  # ---------- Version consistency ----------
  version_consistency:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Version consistency
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check pinned versions are consistent
        run: bash .github/scripts/ci/check-version-consistency.sh


  # ==============================================================================
  # HEAVY TIER — runs on non-draft PRs targeting main only
  # ==============================================================================

  # ---------- Storybook interaction tests ----------
  heavy_storybook_tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: Storybook interaction tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        # working-directory: frontend so `corepack install` reads the Yarn version from frontend/package.json
        working-directory: frontend
        run: |
          corepack enable
          corepack install

      - name: Cache Yarn
        id: cache_yarn
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/.yarn/cache
            frontend/.yarn/install-state.gz
            frontend/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock', 'frontend/.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.cache_yarn.outputs.cache-hit != 'true'
        working-directory: frontend
        run: yarn install --immutable

      - name: Cache Playwright browsers
        id: cache_playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Storybook build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Install Playwright browsers
        if: steps.cache_playwright.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.cache_playwright.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Storybook interaction tests
        working-directory: frontend
        run: yarn storybook:test:ci


  # ---------- Semgrep (frontend SAST) ----------
  heavy_semgrep:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: Semgrep (frontend SAST)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        id: setup_python
        with:
          python-version-file: .python-version

      - name: Cache Semgrep
        id: cache_semgrep
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local/share/pipx/venvs/semgrep
            ~/.local/bin/semgrep
          key: ${{ runner.os }}-semgrep-1.172.0-py${{ steps.setup_python.outputs.python-version }}

      - name: Install Semgrep
        if: steps.cache_semgrep.outputs.cache-hit != 'true'
        run: pipx install semgrep==1.172.0 --python '${{ steps.setup_python.outputs.python-path }}'

      # The folder holding the semgrep command isn't searched by default, so we add it here.
      - name: Ensure pipx bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        working-directory: frontend
        env:
          SEMGREP_LOG_LEVEL: error
          SEMGREP_DISABLE_ANALYTICS: "1"
          SEMGREP_NO_VERSION_CHECK: "1"
        run: semgrep --config .semgrep.yml --error

  # ---------- Prebuild CI app images for E2E ----------
  heavy_e2e_images:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: E2E image build
    timeout-minutes: 20
    env:
      CI_IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_backend:${{ github.sha }}
      CI_IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout teaching-tooling
        uses: actions/checkout@v7.0.1
        with:
          repository: bailey-medics/teaching-tooling
          path: teaching-tooling

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.CI_IMAGE_BACKEND }}
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.CI_IMAGE_FRONTEND }}
          # TODO(clinical): flip to true and add FHIR/EHRbase to compose.ci.yml when we deliver the patient-facing side. See docs/docs/plans/todo.md.
          build-args: VITE_CLINICAL_SERVICES_ENABLED=false
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

  # ---------- E2E (Playwright) ----------
  heavy_e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: E2E (Playwright)
    timeout-minutes: 20
    needs: [heavy_e2e_images]
    env:
      CI_IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_backend:${{ github.sha }}
      CI_IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt CI images
        run: |
          docker pull "$CI_IMAGE_BACKEND"
          docker pull "$CI_IMAGE_FRONTEND"
          # compose.ci.yml Docker compose uses local tags, so apply local tags to pulled images.
          docker tag "$CI_IMAGE_BACKEND" quillmedical-ci_backend:latest
          docker tag "$CI_IMAGE_FRONTEND" quillmedical-ci_frontend:latest

      - name: Start CI stack
        run: docker compose -f compose.ci.yml up --wait --wait-timeout 120

      - name: Seed test data
        # TODO: will need to change this if/when we use factories to seed data instead of a script.
        run: docker exec ci_backend python scripts/seed_ci.py

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        # working-directory: frontend so `corepack install` reads the Yarn version from frontend/package.json
        working-directory: frontend
        run: |
          corepack enable
          corepack install

      - name: Cache Yarn
        id: cache_yarn
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/.yarn/cache
            frontend/.yarn/install-state.gz
            frontend/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock', 'frontend/.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.cache_yarn.outputs.cache-hit != 'true'
        working-directory: frontend
        run: yarn install --immutable

      - name: Cache Playwright browsers
        id: cache_playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.cache_playwright.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.cache_playwright.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --tail=100

  # ---------- Slack test notification ----------
  # Temporary: exercises the reusable slack-notify.yml workflow.
  notify_test:
    name: Slack test notification
    needs: [python_checks, typescript_checks, shell_checks, version_consistency]
    if: always()
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: "CI run"
    secrets: inherit
