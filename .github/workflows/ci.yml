# CI - runs on all non-main branches.
# - Fast tier: runs on every push (lint, typecheck, unit tests, storybook build)
# - Heavy tier: runs on non-draft PRs only (storybook interaction tests, Semgrep, E2E)
# - Both tiers also run on merge_group (a PR entering the merge queue), so the
#   required checks below re-verify against the PR combined with current main
#   rather than trusting a possibly-stale PR branch. See .claude/rules/ci.md.

name: CI

on:
  push:
    branches-ignore:
      - main
      # Creating a merge-queue branch fires a push event as well as
      # merge_group. Both runs share the concurrency group below (same
      # github.ref), so with cancel-in-progress the push run killed the
      # merge_group run seconds after it started, and a cancelled required
      # check reads as a failure - the entry was dropped with 27 of 44
      # checks passed. The push run is redundant anyway: merge_group runs
      # both tiers, and this one's heavy tier skips.
      - "gh-readonly-queue/**"
  pull_request:
    types: [ready_for_review, synchronize]
    # A stacked pull request's base is the branch below it, not main. With
    # `main` alone, marking one ready fired `ready_for_review` and CI did
    # not run, so the heavy tier waited for the next push to that branch:
    # #1289 to #1292 went ready and ran nothing heavy. `feature/**` lets it
    # start on ready, as gate-breaking.yml already does for the same event.
    branches: [main, "feature/**"]
  merge_group:
    types: [checks_requested]

# Read only for every job; the one job that writes says so itself. The
# pull-requests: write that sat here had no user: the two jobs that comment
# or read runs carry their own block.
permissions:
  contents: read
  packages: read # the mirrored images, in GHCR

concurrency:
  # Keyed by event AND action as well as ref, so two runs for the same ref from
  # different triggers can never cancel each other.
  #
  # `github.event_name` alone was not enough. `pull_request` covers two action
  # types here, ready_for_review and synchronize, and a tool that pushes a
  # branch and marks its pull request ready in one operation fires both within
  # the same second - `gh stack submit` does exactly that, every time. Both
  # runs then landed in one group and cancel-in-progress killed one of them.
  #
  # The two are not interchangeable, which is what made it destructive rather
  # than merely wasteful. Every heavy-tier job below is gated on
  # `draft == false`, so the synchronize run - fired while the pull request was
  # still a draft - skips the heavy tier, while the ready_for_review run is the
  # one that carries it. The cheap run cancelled the expensive one, five
  # required checks ended CANCELLED, and GitHub reads a cancelled required
  # check as a failure: PR #683 sat BLOCKED with nothing wrong with it.
  #
  # `github.event.action` is empty for push and merge_group, so their keys are
  # unchanged and the fix above for those two still stands. Rapid re-pushes
  # still cancel each other, since successive synchronize runs share an action.
  group: feature-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # FAST TIER - runs on every push (github.event_name == 'push')
  # ==========================================================================

  # ---------- Python ----------
  python_checks:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Python ${{ matrix.task }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [pre-commit, unit]

    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Set up Python + backend deps
        uses: ./.github/actions/setup-python
        with:
          install-backend-deps: ${{ matrix.task == 'unit' || matrix.task == 'pre-commit' }}

      # ---- Cache for pre-commit ----
      # .venv is intentionally NOT cached: it symlinks into the ephemeral Python
      # toolcache, and a restored copy segfaults when that interpreter is rebuilt.
      - name: Cache pre-commit & pip (pre-commit)
        if: matrix.task == 'pre-commit'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.PRE_COMMIT_HOME }}
            ~/.cache/pip
          key: pc-pre-commit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pc-pre-commit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-
            pc-pre-commit-${{ runner.os }}-

      # ---- pre-commit steps ----
      - name: Ensure venv + pre-commit (pre-commit)
        if: matrix.task == 'pre-commit'
        run: bash .github/scripts/ci/ensure-pre-commit-venv.sh

      - name: Warm pre-commit hooks (pre-commit)
        if: matrix.task == 'pre-commit'
        run: |
          . .venv/bin/activate
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" pre-commit install-hooks

      - name: Run pre-commit (pre-commit)
        if: matrix.task == 'pre-commit'
        run: |
          . .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure --color=always

      # ---- Unit test steps ----
      # One pytest-xdist worker per core. Every worker is its own process,
      # so each gets its own in-memory SQLite database from conftest.py and
      # no test shares state with one in another worker.
      - name: Pytest (unit)
        if: matrix.task == 'unit'
        working-directory: backend
        run: |
          poetry run pytest -q -n auto -m "not integration and not e2e" --maxfail=1 --disable-warnings

  # ---------- Alembic autogenerate-drift check ----------
  # Catches "model changed but migration forgotten": runs the migrations
  # against a fresh Postgres, then fails if autogenerate would still produce
  # any new operations. Needs a real Postgres (SQLite unit tests can't
  # exercise Alembic's autogenerate comparison), so it gets its own small
  # job rather than joining the DB-less `unit` matrix task above.
  alembic_drift_check:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Alembic autogenerate drift check
    timeout-minutes: 10
    outputs:
      # The public image the job had to use because the mirror did not
      # hold it. Empty when Postgres came from the mirror.
      mirror_fell_back: ${{ steps.mirror.outputs.fell_back }}
    env:
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
      CORE_DB_HOST: localhost
      CORE_DB_PORT: 5432
      CORE_DB_NAME: quill_core
      CORE_DB_USER: core_user
      CORE_DB_PASSWORD: ci_test_password
      CLINICAL_SERVICES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7.0.1

      # Postgres is started by a step, and not as a `services:` container,
      # so that it can come from this repository's own copy. A service
      # container is pulled before the first step, from the public
      # registry with no login, which refuses a runner that asks too
      # often: on 12 October 2026 that failed this check on a pull request
      # with nothing wrong in it. The image is the one compose.ci.yml
      # names, so the end-to-end job and this one run the same Postgres.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use the mirrored Postgres where it exists
        id: mirror
        run: bash .github/scripts/ci/use-mirrored-images.sh "${{ github.repository_owner }}" compose.ci.yml CI_POSTGRES_IMAGE

      - name: Start Postgres
        run: bash .github/scripts/ci/start-postgres.sh compose.ci.yml postgres-core "$CORE_DB_NAME" "$CORE_DB_USER" "$CORE_DB_PASSWORD"

      - name: Set up Python + backend deps
        uses: ./.github/actions/setup-python

      - name: Migrate to head
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Check for autogenerate drift
        working-directory: backend
        run: poetry run alembic check

      - name: Run migration tests
        working-directory: backend
        run: poetry run pytest -q -m migration

  # As heavy_e2e_mirror_fell_back below, for the drift check's Postgres.
  alembic_drift_check_mirror_fell_back:
    name: Notify that the drift check used a public image
    needs: [alembic_drift_check]
    if: ${{ always() && github.event_name == 'merge_group' && needs.alembic_drift_check.outputs.mirror_fell_back != '' }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: app
      text: |
        *⚠️ The Alembic drift check pulled from the public registry, not the mirror*

        The mirror did not hold: ${{ needs.alembic_drift_check.outputs.mirror_fell_back }}

        The run carried on with the public image, which can be refused when several jobs pull at once. Run the `Mirror images` workflow to fill the mirror, and if it is already full, check the packages under `mirror/` still give this repository access.

        *Drift check result:* ${{ needs.alembic_drift_check.result }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit



  # ---------- JS: run multiple tools in parallel via matrix ----------
  typescript_checks:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        task: [eslint, prettier, stylelint, "typecheck:all", "storybook:build"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Cache Storybook build artifacts
        if: matrix.task == 'storybook:build'
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Run ${{ matrix.task }}
        working-directory: frontend
        run: |
          case "${{ matrix.task }}" in
            # Through a script and not called bare: each of these passes
            # when given no files, so the script fails one that looked at
            # too few.
            eslint)   bash ../.github/scripts/ci/run-frontend-lint.sh eslint ;;
            prettier) bash ../.github/scripts/ci/run-frontend-lint.sh prettier ;;
            stylelint) bash ../.github/scripts/ci/run-frontend-lint.sh stylelint ;;
            # Then that no source file anywhere in the repository is
            # JavaScript, or in no project typecheck:all ran, which would
            # pass it unchecked.
            "typecheck:all") yarn typecheck:all && bash ../.github/scripts/ci/check-typescript-coverage.sh ;;
            "storybook:build") yarn storybook:build ;;
          esac



  # ---------- Frontend unit tests ----------
  # Split three ways. Vitest already uses every core on one runner, so the
  # only way to go faster is more runners: each leg runs a third of the test
  # files. Change the count in three places together: the matrix, the
  # --shard argument and the job name.
  # See docs/docs/plans/2026-09-30-ci-job-times-plan.md.
  frontend_unit_shards:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Frontend unit tests (${{ matrix.shard }}/3)
    timeout-minutes: 15
    strategy:
      # One leg failing must not cancel the others: a cancelled leg hides
      # whichever failures it had not reached yet.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Run unit tests
        working-directory: frontend
        run: yarn unit-test:run --shard=${{ matrix.shard }}/3

  # Carries the required check's name for the three legs above. The unit
  # tests used to be one leg of the typescript_checks matrix, so the name
  # required in infra/github/branch_rules.tf is that matrix's.
  #
  # `always()` is what makes this safe. Without it a failed leg leaves this
  # job skipped, and a required check that is skipped counts as passed. The
  # rest of the condition is the legs' own.
  frontend_unit_tests:
    if: always() && (github.event_name == 'push' || github.event_name == 'merge_group')
    needs: [frontend_unit_shards]
    runs-on: ubuntu-26.04
    name: typescript_checks (unit-test:run)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Require every leg to have passed
        run: bash .github/scripts/ci/require-matrix-success.sh "Frontend unit tests" "${{ needs.frontend_unit_shards.result }}"


  # ---------- Secret scan ----------
  # The pre-commit hook scans what is staged, on the machine that commits.
  # A commit made where the hook is not installed, or pushed with
  # --no-verify, never meets it, and the pre-commit job above does not
  # make up for that: it runs the same hook with nothing staged, which
  # scans nothing. This scans the commits the branch adds.
  secret_scan:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Secret scan
    timeout-minutes: 5
    steps:
      # The whole history, so the branch can be measured against main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: bash .github/scripts/ci/install-gitleaks.sh

      - name: Scan this branch's commits
        run: bash .github/scripts/ci/run-gitleaks.sh origin/main


  # ---------- Audit ledger ----------
  # audit/ledger.tsv is a text file that anybody can edit, and its merge
  # keeps both sides' lines without looking at them. This checks every
  # line is a stamp: a file the card covers, that the branch has held,
  # with a name, a date and a fingerprint. See audit/README.md.
  audit_ledger:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Audit ledger
    timeout-minutes: 5
    steps:
      # The whole history: a stamp names a version of a file, and the
      # check looks that version up.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The repository's own Python, and not whichever the runner ships:
      # see .github/scripts/ci/check-python-is-set-up.sh.
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-backend-deps: "false"

      - name: Check every stamp holds up
        run: python3 scripts/audit-stamp.py verify


  # ---------- Shell scripts ----------
  shell_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    name: Shell and workflow lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint shell scripts
        run: find .github/scripts .claude/hooks -name '*.sh' -exec shellcheck --source-path=SCRIPTDIR {} +
      # Lints all workflow and composite-action YAML; reuses shellcheck for run: blocks.
      # Installed from its GitHub release and not run from its Docker
      # image, which is on Docker Hub only: see the script for why.
      - name: Install actionlint
        run: bash .github/scripts/ci/install-actionlint.sh
      - name: Lint GitHub Actions workflows
        run: actionlint -color
      - name: Set up bats
        uses: bats-core/bats-action@4.0.0
        with:
          # Pinned, and matched by .github/Dockerfile. Left unset the
          # action resolves `latest` at run time, so a bats release could change
          # what CI runs without changing anything in this repository.
          bats-version: "1.14.0"
          # Only bats core is needed; the tests use no helper libraries.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # 4.0.0 no longer authenticates the download automatically; pass the
          # token to avoid GitHub API rate limits.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The suites under scripts/tests run the Python scripts beside them.
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-backend-deps: "false"

      # Node 26 for scripts/tests/review-marks.bats, which strips the types
      # from the review-marks extension as install.sh does: the Node the
      # runner ships is too old to, and the tests would fail rather than
      # skip.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'

      - name: Run shell script tests
        run: |
          bash .github/scripts/ci/run-shell-tests.sh .github/scripts
          bash .github/scripts/ci/run-shell-tests.sh .claude/hooks
          bash .github/scripts/ci/run-shell-tests.sh scripts/tests

      # The alert watcher in scripts/alert-watcher/ is a Node package of its
      # own, run on the home box rather than deployed. Checked here because
      # this job already has Node 26, and the watcher is tooling like the
      # scripts above. `just uaw` runs the same three commands locally.
      - name: Alert watcher type check and tests
        working-directory: scripts/alert-watcher
        run: |
          corepack enable
          yarn install --immutable
          yarn typecheck
          yarn test


  # ---------- Version consistency ----------
  # ---------- Would a tooling change break published content? ----------
  #
  # Content is validated when a content repository changes, and never when
  # the tooling that judges it changes. So a tightening could merge here and
  # a live bank that no longer passes would keep being served until someone
  # happened to push an unrelated change to that repository. This asks the
  # question before the merge rather than after the deploy.
  #
  # Non-blocking on purpose: the answer is "you would break these banks",
  # which is a decision for the author - sometimes the right move is to fix
  # the bank. Reads the bucket and touches no database.
  # ---------- Did anything that judges content change? ----------
  #
  # The sweep below is expensive enough to be worth gating, and more
  # importantly it means something when it runs. Decided by hashing the
  # contract's contents rather than matching touched paths: a branch that
  # edits a validator and then reverts it leaves the contract where it was.
  # The hash is also what a decision file will be recorded against.
  changed_teaching_tooling:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    name: Detect teaching tooling changes
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Compare against the base branch
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash .github/scripts/ci/detect-teaching-tooling-changes.sh \
            "origin/$BASE_REF"


  teaching_content_sweep:
    needs: changed_teaching_tooling
    # Only when something that judges content has actually changed. A check
    # that runs on every pull request is noise; one that fires when the
    # contract could have moved is a signal worth reading.
    if: >-
      github.event_name == 'pull_request'
      && needs.changed_teaching_tooling.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    name: Published teaching content still validates
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Not a secret - a bucket name identifies, it does not authorise, and
      # the access it fronts is granted by workload identity below.
      IMAGES_BUCKET: quill-images-app
    steps:
      - uses: actions/checkout@v7.0.1

      # The shared action, for the Python it keeps between runs. Without
      # the backend's dependencies: see the next step.
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-backend-deps: "false"

      # The validator needs pydantic and pyyaml and nothing else, so it
      # installs from the tooling package rather than the backend's lock.
      - name: Install the validator
        working-directory: backend/app/features/teaching/tooling
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" python -m pip install -U pip
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" python -m pip install "poetry==$(cat "${GITHUB_WORKSPACE}/.poetry-version")"
          poetry config virtualenvs.create false
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" poetry install --no-interaction --no-ansi

      # The read-only account the Terraform plan uses, not the apply
      # account. This job runs on every branch and only reads the images
      # bucket. Once Batch 9 Phase 3 of
      # docs/docs/plans/2026-09-18-environment-isolation-and-iap-plan.md
      # confines the apply account to main, a branch could not sign in as
      # it at all.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_APP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_PLAN_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Sweep published banks
        id: sweep
        run: |
          bash .github/scripts/ci/sweep-live-banks.sh \
            "$IMAGES_BUCKET" sweep-report.txt

      - name: Report the affected banks on the pull request
        if: failure() && steps.sweep.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/ci/post-sweep-comment.sh \
            "${{ github.event.pull_request.number }}" sweep-report.txt


  version_consistency:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    name: Version consistency
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check pinned versions are consistent
        run: bash .github/scripts/ci/check-version-consistency.sh

      # A job that runs the repository's Python without setting it up gets
      # the runner's own, which names no version and so was checked by
      # nothing. See the script.
      - name: Check every job that runs Python sets it up
        run: bash .github/scripts/ci/check-python-is-set-up.sh .github/workflows

      # A public registry refuses a caller that asks too often, and one
      # refused pull takes a pull request, and everything stacked on it,
      # out of the merge queue. So every image CI pulls has to be named in
      # a way the mirror can stand in for. See the script.
      #
      # The clamav-mirror Dockerfile is built FROM scratch, so it pulls
      # nothing; it is checked so that stays true, and is not in
      # mirror-images.yml's list, which copies only images a Dockerfile
      # pulls.
      - name: Check every image CI pulls can come from the mirror
        run: bash .github/scripts/ci/check-mirrored-images.sh compose.ci.yml backend/Dockerfile backend/Dockerfile.caption backend/Dockerfile.scan frontend/Dockerfile .github/clamav-mirror/Dockerfile


  # ==============================================================================
  # HEAVY TIER - runs on non-draft PRs targeting main only
  # ==============================================================================

  # ---------- Storybook interaction tests ----------
  # Split three ways, because the tests themselves are 6 of the job's 7
  # minutes and no cache around them helps. Each leg builds its own
  # Storybook and runs a third of the stories. Change the count in three
  # places together: the matrix, the shard handed to the script and the job
  # name. See docs/docs/plans/2026-09-30-ci-job-times-plan.md.
  heavy_storybook_shards:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Storybook interaction tests (${{ matrix.shard }}/3)
    timeout-minutes: 15
    strategy:
      # One leg failing must not cancel the others: a cancelled leg hides
      # whichever failures it had not reached yet.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Cache Storybook build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      # The tests run in Microsoft's Playwright image, as heavy_e2e's do: it
      # carries the browser and its system packages, so nothing is installed
      # on the runner. Installing them here was an apt-get against Ubuntu's
      # mirrors on every leg, usually 18s but over five minutes on 2 runs in
      # 25, which took the job past 12 minutes. The image is tagged by
      # Playwright version, read from what yarn.lock resolved, so a Renovate
      # bump moves the image with it.
      - name: Read Playwright version
        id: playwright_version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # A step of its own so the pull shows in the job's timings.
      - name: Pull Playwright image
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" docker pull "mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"

      # Storybook is built and served on the runner, and only the test
      # runner goes into the image, which keeps Yarn 4 out of it. A static
      # build, not `storybook dev`: the dev server compiles each story the
      # first time a test asks for it, so the tests waited on Vite too.
      - name: Run Storybook interaction tests
        run: bash .github/scripts/ci/run-storybook-tests-in-image.sh "mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble" "${{ matrix.shard }}/3"

  # Carries the required check's name for the three legs above. The name is
  # required in infra/github/branch_rules.tf and read by
  # scripts/stack-status.py, and a matrix reports as "… (1/3)" instead.
  #
  # `always()` is what makes this safe. Without it a failed leg leaves this
  # job skipped, and a required check that is skipped counts as passed. The
  # rest of the condition is the legs' own, so a draft still skips it.
  heavy_storybook_tests:
    if: always() && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group')
    needs: [heavy_storybook_shards]
    runs-on: ubuntu-26.04
    name: Storybook interaction tests
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Require every leg to have passed
        run: bash .github/scripts/ci/require-matrix-success.sh "Storybook interaction tests" "${{ needs.heavy_storybook_shards.result }}"


  # ---------- SAST ----------
  # Static analysis of the frontend and the backend, with Semgrep. Named
  # "Semgrep (frontend SAST)" until 14 October 2026, from when it scanned
  # the frontend alone.
  heavy_semgrep:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: SAST
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # No setup-python here. Semgrep needs a Python to run on, not the
      # project's, and the runner already has one. Asking for the exact
      # version in .python-version made every run download it from
      # GitHub's releases, and that download returning 504 failed this job
      # in the merge queue on 12 October 2026.
      #
      # The pipx venv is intentionally NOT cached: it links to the runner's
      # Python, which changes when the runner image does. Cache pip's
      # download cache so the reinstall stays fast.
      - name: Cache pip (Semgrep)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-semgrep-pip-1.172.0-runner-python
          restore-keys: |
            ${{ runner.os }}-semgrep-pip-

      - name: Install Semgrep
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" pipx install semgrep==1.172.0

      # The folder holding the semgrep command isn't searched by default, so we add it here.
      - name: Ensure pipx bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Through a script and not called bare: Semgrep passes a scan that
      # opened no files, and a rule that matches nothing. The script fails
      # a scan of fewer files than the number given, and first checks each
      # rule finds its line in the folder's canary file.
      #
      # The frontend is about 1,250 files, so 500 is well under it.
      - name: Run Semgrep on the frontend
        env:
          SEMGREP_LOG_LEVEL: error
          SEMGREP_DISABLE_ANALYTICS: "1"
          SEMGREP_NO_VERSION_CHECK: "1"
        run: bash .github/scripts/ci/run-semgrep.sh frontend 500

      # In this job and not one of its own, so the backend scan is behind
      # the same required check from the day it lands. The job keeps the
      # name the branch rules know it by.
      #
      # The backend is about 160 files once its tests and migrations are
      # left out, as the backend's own Semgrep ignore file does.
      - name: Run Semgrep on the backend
        env:
          SEMGREP_LOG_LEVEL: error
          SEMGREP_DISABLE_ANALYTICS: "1"
          SEMGREP_NO_VERSION_CHECK: "1"
        run: bash .github/scripts/ci/run-semgrep.sh backend 100

  # ---------- Prebuild CI app images for E2E ----------
  # The layer cache is read here and never written. e2e-image-cache.yml
  # saves it on main, which is the only place a pull request and the merge
  # queue can both read from; a copy saved here was readable by this pull
  # request alone and took 107s of the job to write. The scopes, targets and
  # build arguments must match that workflow.
  heavy_e2e_images:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group'
    permissions:
      contents: read
      packages: write # pushes the E2E images the shards pull
    runs-on: ubuntu-26.04
    name: E2E image build
    timeout-minutes: 20
    outputs:
      # The public base images a build had to use because the mirror did
      # not hold them. Empty when every one came from the mirror.
      base_fell_back_backend: ${{ steps.base_backend.outputs.fell_back }}
      base_fell_back_frontend: ${{ steps.base_frontend.outputs.fell_back }}
    env:
      CI_IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_backend:${{ github.sha }}
      CI_IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_frontend:${{ github.sha }}
      CI_IMAGE_PUBLIC: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_public:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        # BuildKit's own image, from Google's mirror of Docker Hub. Pulled
        # from Docker Hub itself it is rate limited, and one such failure
        # stopped a deploy on 9 October 2026.
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on this repository's own copies of Python, Node and Caddy,
      # which the login above can pull, and not on the public registry,
      # which refuses a caller that asks too often: that failed this job in
      # the merge queue on 12 October 2026 and took seven pull requests out
      # of it. mirror-images.yml makes the copies. An image the mirror does
      # not hold yet is built on from the public registry, as before.
      - name: Use the mirrored base images for the backend
        id: base_backend
        run: bash .github/scripts/ci/use-mirrored-base-images.sh "${{ github.repository_owner }}" backend/Dockerfile

      - name: Use the mirrored base images for the frontend
        id: base_frontend
        run: bash .github/scripts/ci/use-mirrored-base-images.sh "${{ github.repository_owner }}" frontend/Dockerfile

      - name: Build and push backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.CI_IMAGE_BACKEND }}
          build-args: ${{ steps.base_backend.outputs.build_args }}
          cache-from: type=gha,scope=ci-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.CI_IMAGE_FRONTEND }}
          # TODO(clinical): flip to true and add FHIR/EHRbase to compose.ci.yml when we deliver the patient-facing side. See docs/docs/plans/todo.md.
          build-args: |
            VITE_CLINICAL_SERVICES_ENABLED=false
            ${{ steps.base_frontend.outputs.build_args }}
          cache-from: type=gha,scope=ci-frontend

      # The public site, quill-medical.com, which the tests open and
      # follow into the app. Production serves it from Cloud Storage.
      - name: Build and push public site image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./frontend/Dockerfile
          target: public-ci
          push: true
          tags: ${{ env.CI_IMAGE_PUBLIC }}
          build-args: ${{ steps.base_frontend.outputs.build_args }}
          cache-from: type=gha,scope=ci-public

  # ---------- E2E (Playwright) ----------
  # Split three ways, because the tests are about 13 of the job's 15
  # minutes. Each leg is its own runner with its own stack and database,
  # seeded the same way, and runs a third of the tests. Change the count in
  # three places together: the matrix, the shard handed to Playwright and
  # the job name. See docs/docs/plans/2026-10-27-e2e-shards-plan.md.
  heavy_e2e_shards:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: E2E (Playwright) (${{ matrix.shard }}/3)
    timeout-minutes: 20
    needs: [heavy_e2e_images]
    strategy:
      # One leg failing must not cancel the others: a cancelled leg hides
      # whichever failures it had not reached yet.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_backend:${{ github.sha }}
      CI_IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_frontend:${{ github.sha }}
      CI_IMAGE_PUBLIC: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_public:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt CI images
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" docker pull "$CI_IMAGE_BACKEND"
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" docker pull "$CI_IMAGE_FRONTEND"
          bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" docker pull "$CI_IMAGE_PUBLIC"
          # compose.ci.yml Docker compose uses local tags, so apply local tags to pulled images.
          docker tag "$CI_IMAGE_BACKEND" quillmedical-ci_backend:latest
          docker tag "$CI_IMAGE_FRONTEND" quillmedical-ci_frontend:latest
          docker tag "$CI_IMAGE_PUBLIC" quillmedical-ci_public:latest

      # The image is the prod target, built from the same Dockerfile and
      # context as the one deploy.yml ships. A backend test may sit beside
      # its module under backend/app/, which the Dockerfile copies whole;
      # the root .dockerignore keeps those out, and this fails if it stops.
      - name: Check the backend image holds no test code
        run: .github/scripts/ci/check-no-tests-in-image.sh "$CI_IMAGE_BACKEND"

      # A module for the teaching tests to open. seed_ci.py syncs it.
      - name: Fetch E2E teaching content
        run: .github/scripts/ci/fetch-e2e-teaching.sh

      # The folder the stack writes its emails to, for the tests to read.
      - name: Prepare the E2E mail folder
        run: .github/scripts/ci/prepare-e2e-mail.sh

      # The key pair the tests stand in for the video jobs with. Made per
      # run and never committed; compose.ci.yml mounts the public half.
      - name: Prepare the E2E job key
        run: .github/scripts/ci/prepare-e2e-job-key.sh

      # Before the stack starts: Postgres and Caddy come from this
      # repository's own copies where it has them, pulled with the login
      # above, and not from the public registry, which refuses a runner
      # that asks too often. mirror-images.yml makes the copies.
      - name: Use the mirrored images where they exist
        id: mirror
        run: bash .github/scripts/ci/use-mirrored-images.sh "${{ github.repository_owner }}" compose.ci.yml CI_POSTGRES_IMAGE CI_CADDY_IMAGE

      # A matrix job's output is whichever leg wrote it last, so a fallback
      # one leg saw could vanish behind a leg that saw none. Each leg that
      # fell back hands its list to the gate job as a file instead.
      - name: Record the public images this leg fell back to
        if: steps.mirror.outputs.fell_back != ''
        env:
          FELL_BACK: ${{ steps.mirror.outputs.fell_back }}
        run: printf '%s\n' "$FELL_BACK" > "${RUNNER_TEMP}/fell-back.txt"

      - name: Upload the public images this leg fell back to
        if: steps.mirror.outputs.fell_back != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-mirror-fell-back-${{ matrix.shard }}
          path: ${{ runner.temp }}/fell-back.txt
          retention-days: 1

      - name: Start CI stack
        run: docker compose -f compose.ci.yml up --wait --wait-timeout 120

      # The prod image no longer runs migrations on startup (see item 12 of
      # docs/docs/plans/2026-08-09-alembic-review-and-revisions-plan.md), so
      # this ephemeral CI database needs them applied explicitly before seeding.
      - name: Run database migrations
        run: docker compose -f compose.ci.yml exec -T backend alembic upgrade head

      - name: Seed test data
        # TODO: will need to change this if/when we use factories to seed data instead of a script.
        run: docker compose -f compose.ci.yml exec -T backend python scripts/seed_ci.py

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # The tests run in Microsoft's Playwright image, which carries the
      # browsers and the system packages they need, so nothing is installed
      # here. Installing them on the runner took 40 to 60s on a good run,
      # and 6 to 19 minutes when Playwright's download servers or Ubuntu's
      # package mirrors were slow, which timed the job out. The image is
      # tagged by Playwright version, read from what yarn.lock resolved, so a
      # Renovate bump moves the image with it.
      - name: Read Playwright version
        id: playwright_version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # A step of its own so the pull shows in the job's timings.
      - name: Pull Playwright image
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/shared/retry-once.sh" docker pull "mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"

      # --network host so localhost is the CI stack, exactly as it was on the
      # runner. The runner's own user, so the report it writes stays
      # removable, with HOME somewhere that user may write.
      # The pinned teaching module is mounted too, at the path
      # `../.e2e-teaching` reaches from /work, so e2e/fixtures/answers.ts
      # can read its answers as it does on a developer's machine.
      # Writable, because e2e/fixtures/mediaJobs.ts stands in for the
      # transcode and caption jobs by writing their files beside an
      # upload, as they would.
      - name: Run E2E tests
        working-directory: frontend
        run: >-
          docker run --rm --network host --ipc host
          --user "$(id -u):$(id -g)"
          -e CI -e HOME=/tmp
          -v "$PWD:/work" -w /work
          -v "$PWD/../.e2e-teaching:/.e2e-teaching"
          "mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"
          npx playwright test --shard=${{ matrix.shard }}/3

      # Named by leg, because a run refuses two artifacts of one name. Kept
      # as three reports rather than merged into one: a failure is read
      # from the leg that failed.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --tail=100

  # Carries the required check's name for the three legs above. The name is
  # required in infra/github/branch_rules.tf and read by
  # scripts/stack-status.py, and a matrix reports as "... (1/3)" instead. It
  # keeps the job id heavy_e2e too, so the jobs that read its result and
  # its output need no change.
  #
  # `always()` is what makes this safe. Without it a failed leg leaves this
  # job skipped, and a required check that is skipped counts as passed. The
  # rest of the condition is the legs' own, so a draft still skips it.
  heavy_e2e:
    if: always() && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group')
    needs: [heavy_e2e_shards]
    runs-on: ubuntu-26.04
    name: E2E (Playwright)
    timeout-minutes: 5
    outputs:
      # The public images any leg had to use because the mirror did not
      # hold them. Empty when every image came from the mirror.
      mirror_fell_back: ${{ steps.mirror.outputs.fell_back }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Before the check below, so the list is handed on when a leg failed
      # too: a refused public pull is the failure it most needs to explain.
      - name: Download the public images the legs fell back to
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: e2e-mirror-fell-back-*
          path: ${{ runner.temp }}/fell-back

      - name: Collect the public images the legs fell back to
        id: mirror
        run: bash .github/scripts/ci/collect-mirror-fell-back.sh "${{ runner.temp }}/fell-back"

      - name: Require every leg to have passed
        run: bash .github/scripts/ci/require-matrix-success.sh "E2E (Playwright)" "${{ needs.heavy_e2e_shards.result }}"

  # The end-to-end job, and the image builds before it, carry on with the
  # public image when the mirror does not hold one, which is safe but is
  # the very thing the mirror is there to stop, so it is said out loud and
  # not left in a log.
  #
  # In the merge queue only. That is where a refused pull costs something,
  # and a pull request that changes an image's version starts its own
  # end-to-end run before the mirror has caught up, which is expected and
  # would be a false alarm every time.
  #
  # always(), because the run that most needs reporting is the one where
  # the public registry then refused the pull and the job failed.
  heavy_e2e_mirror_fell_back:
    name: Notify that E2E used a public image
    needs: [heavy_e2e_images, heavy_e2e]
    if: ${{ always() && github.event_name == 'merge_group' && (needs.heavy_e2e.outputs.mirror_fell_back != '' || needs.heavy_e2e_images.outputs.base_fell_back_backend != '' || needs.heavy_e2e_images.outputs.base_fell_back_frontend != '') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: app
      text: |
        *⚠️ E2E pulled from the public registry, not the mirror*

        The mirror did not hold, for the stack: ${{ needs.heavy_e2e.outputs.mirror_fell_back || 'nothing missing' }}
        For the backend build: ${{ needs.heavy_e2e_images.outputs.base_fell_back_backend || 'nothing missing' }}
        For the frontend build: ${{ needs.heavy_e2e_images.outputs.base_fell_back_frontend || 'nothing missing' }}

        The run carried on with the public image, which can be refused when several jobs pull at once. Run the `Mirror images` workflow to fill the mirror, and if it is already full, check the packages under `mirror/` still give this repository access.

        *Image build result:* ${{ needs.heavy_e2e_images.result }}
        *E2E result:* ${{ needs.heavy_e2e.result }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit

  # ---------- Competency catalogue ----------
  # A competency is retired, never deleted. Deleting one from
  # shared/competency-definitions/ revokes nothing - resolve_user_competencies does
  # set operations on plain strings and has_competency compares a string from
  # the route against that set, so everyone who holds it keeps the access and
  # it merely stops being describable. It also destroys the vocabulary the
  # audit trail needs to say what someone was authorised to do.
  #
  # Same shape as the migration immutability check below: it records nothing,
  # it just fails, so it stays out of gate-breaking.yml.
  fast_competency_catalogue_check:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: Competency catalogue check
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch ref (for the catalogue diff)
        run: git fetch origin main:refs/remotes/origin/main

      - name: Check no competency was deleted rather than retired
        run: bash .github/scripts/ci/check-competencies-not-deleted.sh origin/main

  # ---------- Migration immutability ----------
  # A merged migration does not change, at all. The destructive-migration gate
  # only inspects migrations ADDED on a PR, so a drop_column edited into a file
  # already on main is invisible to it - and the allow-destructive marker and
  # its rationale record a decision a human approved, so rewriting them
  # misrepresents what was approved.
  #
  # Deliberately NOT in gate-breaking.yml: that workflow exists for jobs that
  # RECORD something and so must never be cancelled. This records nothing, it
  # just fails, and a cancelled run is simply re-checked by the next one.
  heavy_db_migration_immutability_check:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    name: DB migration immutability check
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch ref (for the changed-migrations diff)
        run: git fetch origin main:refs/remotes/origin/main

      # On a pull request, the commit it was built on rather than main: on a
      # stacked pull request that is the branch below, and diffing against
      # main would report the migrations of every branch underneath as this
      # one's. The destructive-migration gate resolves its base the same
      # way, for the same reason. A merge queue run has no branch below, so
      # it compares against main as before, and checks the stack whole.
      - name: Resolve the base commit the PR ref was merged onto
        if: github.event_name == 'pull_request'
        id: base
        run: bash .github/scripts/ci/resolve-pr-base-sha.sh .

      # The comparer this calls needs nothing installed, but it is a file
      # in backend/, written and formatted for the repository's Python.
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-backend-deps: "false"

      - name: Check no merged migration was rewritten, deleted or renamed
        run: bash .github/scripts/ci/check-migrations-unmodified.sh "${{ steps.base.outputs.base_sha || 'origin/main' }}"

  # ---------- Say why a merge queue run failed ----------
  # The queue removes a pull request when any check fails, and tells
  # nobody. On 12 October 2026 seven went that way, none of them with a
  # fault of its own: a registry refused a pull and a download returned
  # 504. This reads the failed jobs' logs, decides whether the code failed
  # or something outside it did, and says so in Slack with the pull
  # request's number.
  #
  # It does not put the pull request back. One added to the queue with a
  # workflow's own token gets no checks run on it and waits for ever.
  #
  # Every job is in `needs`, so this waits for the last of them and sees
  # each result. A job added to this workflow is added here too.
  queue_failure_report:
    name: Read why the merge queue run failed
    needs:
      - python_checks
      - alembic_drift_check
      - typescript_checks
      - frontend_unit_tests
      - secret_scan
      - audit_ledger
      - shell_checks
      - teaching_content_sweep
      - version_consistency
      - heavy_storybook_tests
      - heavy_semgrep
      - heavy_e2e
      - fast_competency_catalogue_check
      - heavy_db_migration_immutability_check
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      verdict: ${{ steps.report.outputs.verdict }}
      text: ${{ steps.report.outputs.text }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/scripts

      - name: Read the failed jobs
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci/report-queue-failure.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REF"

  queue_failure_notify:
    name: Notify why the merge queue run failed
    needs: queue_failure_report
    if: ${{ always() && needs.queue_failure_report.result == 'success' }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: app
      text: ${{ needs.queue_failure_report.outputs.text }}
    secrets: inherit
