# CI — runs on all non-main branches.
# - Fast tier: runs on every push (lint, typecheck, unit tests, storybook build)
# - Heavy tier: runs on non-draft PRs only (storybook interaction tests, Semgrep, E2E)

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # FAST TIER — runs on every push (github.event_name == 'push')
  # ==========================================================================

  # ---------- Python ----------
  python_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Python ${{ matrix.task }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [pre-commit, unit]

    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Set up Python + backend deps
        uses: ./.github/actions/setup-python
        with:
          install-backend-deps: ${{ matrix.task == 'unit' || matrix.task == 'pre-commit' }}

      # ---- Cache for pre-commit ----
      # .venv is intentionally NOT cached: it symlinks into the ephemeral Python
      # toolcache, and a restored copy segfaults when that interpreter is rebuilt.
      - name: Cache pre-commit & pip (pre-commit)
        if: matrix.task == 'pre-commit'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.PRE_COMMIT_HOME }}
            ~/.cache/pip
          key: pc-pre-commit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pc-pre-commit-${{ runner.os }}-py${{ hashFiles('.python-version') }}-
            pc-pre-commit-${{ runner.os }}-

      # ---- pre-commit steps ----
      - name: Ensure venv + pre-commit (pre-commit)
        if: matrix.task == 'pre-commit'
        run: bash .github/scripts/ci/ensure-pre-commit-venv.sh

      - name: Warm pre-commit hooks (pre-commit)
        if: matrix.task == 'pre-commit'
        run: |
          . .venv/bin/activate
          pre-commit install-hooks

      - name: Run pre-commit (pre-commit)
        if: matrix.task == 'pre-commit'
        run: |
          . .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure --color=always

      # ---- Unit test steps ----
      - name: Pytest (unit)
        if: matrix.task == 'unit'
        working-directory: backend
        run: |
          poetry run pytest -q -m "not integration and not e2e" --maxfail=1 --disable-warnings

  # ---------- Alembic autogenerate-drift check ----------
  # Catches "model changed but migration forgotten": runs the migrations
  # against a fresh Postgres, then fails if autogenerate would still produce
  # any new operations. Needs a real Postgres (SQLite unit tests can't
  # exercise Alembic's autogenerate comparison), so it gets its own small
  # job rather than joining the DB-less `unit` matrix task above.
  alembic_drift_check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Alembic autogenerate drift check
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: quill_core
          POSTGRES_USER: core_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_user -d quill_core"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
      CORE_DB_HOST: localhost
      CORE_DB_PORT: 5432
      CORE_DB_NAME: quill_core
      CORE_DB_USER: core_user
      CORE_DB_PASSWORD: ci_test_password
      CLINICAL_SERVICES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python + backend deps
        uses: ./.github/actions/setup-python

      - name: Migrate to head
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Check for autogenerate drift
        working-directory: backend
        run: poetry run alembic check

      - name: Run drift-check regression tests
        working-directory: backend
        run: poetry run pytest -q -m integration tests/test_alembic_check.py



  # ---------- JS: run multiple tools in parallel via matrix ----------
  typescript_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        task: [eslint, prettier, stylelint, "typecheck:all", "unit-test:run", "storybook:build"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Cache Storybook build artifacts
        if: matrix.task == 'storybook:build'
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Cache ESLint
        if: matrix.task == 'eslint'
        uses: actions/cache@v6.1.0
        with:
          path: frontend/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('frontend/**/*.{ts,tsx,js,jsx}', 'frontend/eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run ${{ matrix.task }}
        working-directory: frontend
        run: |
          case "${{ matrix.task }}" in
            eslint)   yarn eslint ;;
            prettier) yarn prettier ;;
            stylelint) yarn stylelint ;;
            "typecheck:all") yarn typecheck:all ;;
            "unit-test:run") yarn unit-test:run ;;
            "storybook:build") yarn storybook:build ;;
          esac



  # ---------- Shell scripts ----------
  shell_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Shell and workflow lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint shell scripts
        run: find .github/scripts .claude/hooks -name '*.sh' -exec shellcheck --source-path=SCRIPTDIR {} +
      # Lints all workflow and composite-action YAML; reuses shellcheck for run: blocks.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.8
        with:
          args: -color
      - name: Set up bats
        uses: bats-core/bats-action@4.0.0
        with:
          # Only bats core is needed; the tests use no helper libraries.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # 4.0.0 no longer authenticates the download automatically; pass the
          # token to avoid GitHub API rate limits.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run shell script tests
        run: |
          bash .github/scripts/ci/run-shell-tests.sh .github/scripts
          bash .github/scripts/ci/run-shell-tests.sh .claude/hooks


  # ---------- Version consistency ----------
  # ---------- Would a tooling change break published content? ----------
  #
  # Content is validated when a content repository changes, and never when
  # the tooling that judges it changes. So a tightening could merge here and
  # a live bank that no longer passes would keep being served until someone
  # happened to push an unrelated change to that repository. This asks the
  # question before the merge rather than after the deploy.
  #
  # Non-blocking on purpose: the answer is "you would break these banks",
  # which is a decision for the author — sometimes the right move is to fix
  # the bank. Reads the bucket and touches no database.
  # ---------- Did anything that judges content change? ----------
  #
  # The sweep below is expensive enough to be worth gating, and more
  # importantly it means something when it runs. Decided by hashing the
  # contract's contents rather than matching touched paths: a branch that
  # edits a validator and then reverts it leaves the contract where it was.
  # The hash is also what a decision file will be recorded against.
  changed_teaching_tooling:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    name: Detect teaching tooling changes
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Compare against the base branch
        id: detect
        run: |
          bash .github/scripts/ci/detect-teaching-tooling-changes.sh \
            "origin/${{ github.event.pull_request.base.ref }}"


  teaching_content_sweep:
    needs: changed_teaching_tooling
    # Only when something that judges content has actually changed. A check
    # that runs on every pull request is noise; one that fires when the
    # contract could have moved is a signal worth reading.
    if: >-
      github.event_name == 'pull_request'
      && needs.changed_teaching_tooling.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    name: Published teaching content still validates
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Not a secret — a bucket name identifies, it does not authorise, and
      # the access it fronts is granted by workload identity below.
      TEACHING_BUCKET: quill-images-teaching
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # The validator needs pydantic and pyyaml and nothing else, so it
      # installs from the tooling package rather than the backend's lock.
      - name: Install the validator
        working-directory: backend/app/features/teaching/tooling
        run: |
          python -m pip install -U pip
          python -m pip install "poetry==$(cat "${GITHUB_WORKSPACE}/.poetry-version")"
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Sweep published banks
        id: sweep
        run: |
          bash .github/scripts/ci/sweep-live-banks.sh \
            "$TEACHING_BUCKET" sweep-report.txt

      - name: Report the affected banks on the pull request
        if: failure() && steps.sweep.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/ci/post-sweep-comment.sh \
            "${{ github.event.pull_request.number }}" sweep-report.txt


  version_consistency:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Version consistency
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check pinned versions are consistent
        run: bash .github/scripts/ci/check-version-consistency.sh


  # ==============================================================================
  # HEAVY TIER — runs on non-draft PRs targeting main only
  # ==============================================================================

  # ---------- Storybook interaction tests ----------
  heavy_storybook_tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: Storybook interaction tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Cache Playwright browsers
        id: cache_playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Storybook build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/node_modules/.vite
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/src/**/*.{ts,tsx,css}', 'frontend/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Install Playwright browsers
        if: steps.cache_playwright.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.cache_playwright.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Storybook interaction tests
        working-directory: frontend
        run: yarn storybook:test:ci


  # ---------- Semgrep (frontend SAST) ----------
  heavy_semgrep:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: Semgrep (frontend SAST)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        id: setup_python
        with:
          python-version-file: .python-version

      # The pipx venv is intentionally NOT cached: it symlinks into the ephemeral
      # Python toolcache, and a restored copy segfaults when that interpreter is
      # rebuilt. Cache pip's download cache so the reinstall stays fast.
      - name: Cache pip (Semgrep)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-semgrep-pip-1.172.0-py${{ steps.setup_python.outputs.python-version }}
          restore-keys: |
            ${{ runner.os }}-semgrep-pip-

      - name: Install Semgrep
        run: pipx install semgrep==1.172.0 --python '${{ steps.setup_python.outputs.python-path }}'

      # The folder holding the semgrep command isn't searched by default, so we add it here.
      - name: Ensure pipx bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        working-directory: frontend
        env:
          SEMGREP_LOG_LEVEL: error
          SEMGREP_DISABLE_ANALYTICS: "1"
          SEMGREP_NO_VERSION_CHECK: "1"
        run: semgrep --config .semgrep.yml --error

  # ---------- Prebuild CI app images for E2E ----------
  heavy_e2e_images:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: E2E image build
    timeout-minutes: 20
    env:
      CI_IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_backend:${{ github.sha }}
      CI_IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.CI_IMAGE_BACKEND }}
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.CI_IMAGE_FRONTEND }}
          # TODO(clinical): flip to true and add FHIR/EHRbase to compose.ci.yml when we deliver the patient-facing side. See docs/docs/plans/todo.md.
          build-args: VITE_CLINICAL_SERVICES_ENABLED=false
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

  # ---------- E2E (Playwright) ----------
  heavy_e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: E2E (Playwright)
    timeout-minutes: 20
    needs: [heavy_e2e_images]
    env:
      CI_IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_backend:${{ github.sha }}
      CI_IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/quillmedical-ci_frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt CI images
        run: |
          docker pull "$CI_IMAGE_BACKEND"
          docker pull "$CI_IMAGE_FRONTEND"
          # compose.ci.yml Docker compose uses local tags, so apply local tags to pulled images.
          docker tag "$CI_IMAGE_BACKEND" quillmedical-ci_backend:latest
          docker tag "$CI_IMAGE_FRONTEND" quillmedical-ci_frontend:latest

      - name: Start CI stack
        run: docker compose -f compose.ci.yml up --wait --wait-timeout 120

      # The prod image no longer runs migrations on startup (see item 12 of
      # docs/docs/plans/2026-08-09-alembic-review-and-revisions-plan.md), so
      # this ephemeral CI database needs them applied explicitly before seeding.
      - name: Run database migrations
        run: docker exec ci_backend alembic upgrade head

      - name: Seed test data
        # TODO: will need to change this if/when we use factories to seed data instead of a script.
        run: docker exec ci_backend python scripts/seed_ci.py

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Cache Playwright browsers
        id: cache_playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.cache_playwright.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.cache_playwright.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --tail=100

  # ---------- Migration immutability ----------
  # A merged migration does not change, at all. The destructive-migration gate
  # only inspects migrations ADDED on a PR, so a drop_column edited into a file
  # already on main is invisible to it - and the allow-destructive marker and
  # its rationale record a decision a human approved, so rewriting them
  # misrepresents what was approved.
  #
  # Deliberately NOT in gate-breaking.yml: that workflow exists for jobs that
  # RECORD something and so must never be cancelled. This records nothing, it
  # just fails, and a cancelled run is simply re-checked by the next one.
  heavy_db_migration_immutability_check:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    name: DB migration immutability check
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch ref (for the changed-migrations diff)
        run: git fetch origin main:refs/remotes/origin/main

      # No setup-python step: the comparer this calls is stdlib-only, and
      # ubuntu-24.04 ships python3.
      - name: Check no merged migration was rewritten, deleted or renamed
        run: bash .github/scripts/ci/check-migrations-unmodified.sh origin/main
