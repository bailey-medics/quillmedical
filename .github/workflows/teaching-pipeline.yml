# Unified teaching CI/CD pipeline.
#
# Called by content repos (e.g. eoeeta-teaching) via a single thin caller.
# Dispatches to the appropriate job based on the triggering event:
#
#   push to feature/**  → auto-create PR
#   pull_request        → validate content + check branch protection
#   push to main        → deploy to GCS + start the backend's sync job
#
# Do not rename the jobs. Content-repo rulesets require status checks
# called "pipeline / validate" and "pipeline / check-protection", composed
# from the caller's job name plus the job names here, so a rename leaves
# the ruleset waiting for a check that never reports.
name: Teaching pipeline

on:
  workflow_call:
    inputs:
      org_id:
        description: "Organisation identifier (e.g. eoeeta, respiratory)"
        required: true
        type: string

jobs:
  # -------------------------------------------------------------------
  # Auto-create a draft PR when a feature branch is first pushed
  # -------------------------------------------------------------------
  auto-pr:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No lfs: true here, unlike validate and deploy - this job only opens
      # a pull request and never reads the content.
      - name: Check out question bank content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: question_bank_content

      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          sparse-checkout: |
            .github/scripts

      # Quill's own script: handles the concurrent-run race, derives a
      # title from the branch, and opens the PR as a draft.
      - name: Create PR if none exists
        working-directory: question_bank_content
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../tooling/.github/scripts/auto-pr/create-pr.sh "$GITHUB_REF_NAME"

  # -------------------------------------------------------------------
  # Validate content on pull request
  # -------------------------------------------------------------------
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-26.04
    # Fifteen rather than ten since the malware scan was added: fetching
    # ClamAV and its definitions from the mirror, and scanning, add a
    # minute or two.
    timeout-minutes: 15
    # packages: read is for the ClamAV mirror, a private image in Quill's
    # GHCR. A job that lists its permissions gets none it does not list,
    # so without this the pull is "denied" however the package is shared.
    # The calling workflow in each teaching repository must grant it too:
    # a reusable workflow cannot hold more than its caller gives.
    permissions:
      contents: read
      packages: read
    steps:
      # lfs: true so that a repo genuinely using LFS gets real images
      # rather than pointers, which carry the right name and extension and
      # would otherwise be validated and deployed in place of the image.
      #
      # This is only safe while a repo's .gitattributes is honest. Both
      # content repos once declared *.png as LFS while storing plain
      # blobs; enabling LFS here made git rewrite every working-tree PNG
      # to a pointer before diffing, so untouched images looked modified
      # and the version lock failed on a branch that changed no content.
      # A repo that declares LFS must actually use it.
      - name: Check out question bank content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: question_bank_content
          fetch-depth: 0
          lfs: true

      - name: Fetch main branch
        working-directory: question_bank_content
        run: git fetch origin main

      # Cone mode also brings the files sitting directly in each parent
      # directory, which is how mdx_parser.py and the app/ __init__ chain
      # arrive without being listed. Everything else in Quill stays out.
      - name: Check out the Quill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          sparse-checkout: |
            backend/app/features/teaching/tooling
            backend/Dockerfile.scan
            .github/scripts/shared
            .github/scripts/teaching-pipeline
            .github/scripts/clamav-mirror

      # Quill's .github/actions/setup-python is not usable here: its paths
      # assume Quill is the workspace root, which in a reusable workflow is
      # the content repo, and its caching is tied to a full Poetry install
      # of the backend that this deliberately does not need.
      #
      # What it does to keep the installed Python between runs is copied
      # here, with the same key. setup-python otherwise downloads the exact
      # version from GitHub's releases on every run, and a 504 from that
      # download fails the content repo's check. The cache is the content
      # repo's own, since that is whose run this is.
      - name: Read the Python version
        id: python_version
        run: |
          echo "version=$(tr -d '[:space:]' < tooling/.python-version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the installed Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.python_version.outputs.version }}
          key: python-install-${{ runner.os }}-${{ runner.arch }}-${{ steps.python_version.outputs.image }}-${{ steps.python_version.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: tooling/.python-version
          cache: pip
          cache-dependency-path: tooling/backend/app/features/teaching/tooling/poetry.lock

      # The tooling package declares and locks its own dependencies, so
      # this installs the six packages the validator needs rather than the
      # backend's stack. Straight into the runner's Python, so the CLI runs
      # without a venv indirection.
      #
      # Poetry is pinned from Quill's .poetry-version, which the cone-mode
      # sparse checkout brings along with the root .python-version above.
      # The package's requires-poetry constraint is the second half: the pin
      # selects a version, the constraint rejects one that cannot read the
      # lock.
      - name: Install validator dependencies
        working-directory: tooling/backend/app/features/teaching/tooling
        run: |
          bash "${GITHUB_WORKSPACE}/tooling/.github/scripts/shared/retry-once.sh" python -m pip install -U pip
          bash "${GITHUB_WORKSPACE}/tooling/.github/scripts/shared/retry-once.sh" python -m pip install "poetry==$(cat "${GITHUB_WORKSPACE}/tooling/.poetry-version")"
          poetry config virtualenvs.create false
          bash "${GITHUB_WORKSPACE}/tooling/.github/scripts/shared/retry-once.sh" poetry install --no-interaction --no-ansi

      # Run from inside the question bank checkout so the version lock
      # check can resolve its repository root and diff against origin/main.
      - name: Validate teaching content
        working-directory: question_bank_content
        env:
          PYTHONPATH: ${{ github.workspace }}/tooling/backend
        run: |
          python -m app.features.teaching.tooling.cli modules/ --ref origin/main

      # Every file here is served to learners from the teaching bucket, so
      # it is scanned for malware before it can get there, as every file
      # uploaded through the app is. Here, in the required check, because
      # the tree that reaches main is the one this job checked; the deploy
      # job relies on that and does not re-validate. The images are the
      # real bytes, since the checkout above fetches LFS.
      #
      # ClamAV and its definitions come from Quill's clamav-mirror image,
      # which a daily workflow in Quill refreshes. This job no longer asks
      # ClamAV's servers for anything: they refuse an address that asks
      # too often, and GitHub's runners share addresses. The image is
      # private, so the package's settings on GitHub give each teaching
      # repository read access; without it this fails, closed, here.
      - name: Log in to GHCR, for the ClamAV mirror
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ClamAV from the mirror
        run: |
          bash tooling/.github/scripts/clamav-mirror/fetch-mirror.sh bailey-medics tooling/backend/Dockerfile.scan "${RUNNER_TEMP}/clamav-mirror"
          sudo dpkg -i "${RUNNER_TEMP}/clamav-mirror/clamav-$(cat "${RUNNER_TEMP}/clamav-mirror/VERSION").linux.x86_64.deb"

      - name: Scan the content for malware
        run: bash tooling/.github/scripts/teaching-pipeline/scan-content.sh question_bank_content/modules "${RUNNER_TEMP}/clamav-mirror/db"

  # -------------------------------------------------------------------
  # Verify branch protection is configured (catches missing Terraform)
  # -------------------------------------------------------------------
  check-protection:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          sparse-checkout: |
            .github/scripts

      - name: Check for active rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tooling/.github/scripts/teaching-pipeline/check-rulesets.sh "${{ github.repository }}"

  # -------------------------------------------------------------------
  # Deploy content to GCS and trigger backend sync
  # -------------------------------------------------------------------
  #
  # Deliberately does not re-validate. The content ruleset is enforcement =
  # active with zero bypass actors and strict required status checks, so the
  # tree reaching main is byte-identical to the one "pipeline / validate"
  # passed on - a second run could find nothing new.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      execution: ${{ steps.sync.outputs.execution }}
      log_url: ${{ steps.sync.outputs.log_url }}
    steps:
      # lfs: true for the same reason as validate, and with the same
      # caveat - this job uploads the bytes to GCS, so a pointer here
      # reaches candidates as a broken image, and for a visual-diagnosis
      # bank the image is the question.
      - name: Check out question bank content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: question_bank_content
          lfs: true

      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          path: tooling
          sparse-checkout: |
            .github/scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sync to GCS
        run: |
          bash tooling/.github/scripts/teaching-pipeline/sync-to-gcs.sh \
            question_bank_content/modules "${{ secrets.GCP_TEACHING_GCS_BUCKET }}"

      # Starts the backend's own sync job rather than calling an endpoint
      # with a bearer token: the account this run signs in as may start
      # that one job and nothing else, so GitHub holds no credential the
      # live app accepts. The script waits for the job and fails the step
      # if a bank was rejected, naming the execution whose log says why.
      # The outputs are written before the wait, so a failure still has
      # a name for the notice below.
      - name: Start the backend sync job
        id: sync
        run: |
          bash tooling/.github/scripts/teaching-pipeline/run-sync-job.sh \
            "${{ secrets.GCP_SERVICE_ACCOUNT }}"

  # -------------------------------------------------------------------
  # Tell someone when a deploy fails
  # -------------------------------------------------------------------
  #
  # A failed deploy leaves GCS holding content the backend has not imported,
  # and until now nothing said so - the sync could fail and the only trace
  # was a red tick nobody was watching. Names the sync job's execution and
  # links its log, which is where the rejected banks are listed: GitHub
  # cannot read that log itself without a project-wide logging role.
  #
  # Called by full path rather than a relative one: this workflow runs under
  # the content repository, so `./` would look for the file there.
  notify-deploy-failure:
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    permissions:
      contents: read # slack-notify checks out Quill's scripts
    uses: bailey-medics/quillmedical/.github/workflows/slack-notify.yml@main
    with:
      channel: app
      text: |
        *❌ Teaching content deploy failed*

        *Repository:* ${{ github.repository }}
        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>

        *Sync job:* ${{ needs.deploy.outputs.execution != '' && format('<{0}|{1}>', needs.deploy.outputs.log_url, needs.deploy.outputs.execution) || 'not started, see the run' }}
        The rejected banks, if any, are listed in its log.
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
