# Reusable Slack channel messenger
#
# Usage (job level):
#   notify:
#     needs: some-job
#     if: ${{ needs.some-job.result == 'success' }}
#     uses: ./.github/workflows/slack-notify.yml
#     with:
#       channel: app
#       text: |
#         *✅ Deployed to teaching*
#         *Commit:* <...|sha>
#     secrets:
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
#
# Callers pass a slack channel name and markdown message. Unknown channels cause
# a workflow failure.
#
# Callable from outside Quill - the content repos reach it through the teaching
# pipeline. It checks out Quill by name rather than relying on the run's own
# repository, so the channel validation script is always present. The calling
# repository must hold SLACK_WEBHOOK_URL and pass it on by name.
name: Slack notify

on:
  workflow_call:
    inputs:
      text:
        description: "Full Slack markdown message"
        required: true
        type: string
      channel:
        description: "Slack channel to post to (must be a valid channel name)"
        required: true
        type: string
    # Named rather than inherited, so a caller hands over this one secret
    # and not every secret it holds.
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

# A called workflow cannot hold more than its caller grants, but saying
# so here keeps it to reading, whoever calls it.
permissions:
  contents: read # checks out Quill's scripts

jobs:
  send:
    name: Send Slack message
    runs-on: ubuntu-26.04
    env:
      CHANNEL_WEBHOOKS: >-
        {
          "app": "${{ secrets.SLACK_WEBHOOK_URL }}"
        }
    steps:
      # Quill explicitly, not the default checkout. A bare checkout takes the
      # repository whose run this is, which for a content repo calling the
      # teaching pipeline is that content repo - where the validation script
      # does not exist. Naming Quill lets any repo in the org use this.
      - name: Check out the Quill scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bailey-medics/quillmedical
          sparse-checkout: |
            .github/scripts

      - name: Validate channel and webhook
        env:
          CHANNEL: ${{ inputs.channel }}
        run: bash .github/scripts/slack-notify/validate-channel.sh

      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ fromJSON(env.CHANNEL_WEBHOOKS)[inputs.channel] }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(inputs.text) }}
            }
