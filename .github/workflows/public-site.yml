# Deploy public marketing site to the GCS landing bucket.
# Builds the public_pages Vite workspace once and syncs it to the teaching
# project's landing bucket, which serves the apex quill-medical.com domain.
name: Deploy public site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/public_pages/**"
      - "frontend/public/**"
      - "frontend/src/components/**"
      - "frontend/src/theme.ts"
      - "frontend/src/styles/**"

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-public-site
  cancel-in-progress: true

jobs:
  build:
    name: Build public pages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Build public pages
        working-directory: frontend
        run: yarn workspace public-pages build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: public-site
          path: frontend/dist/public_pages/

  deploy-teaching:
    name: Deploy to teaching
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: teaching

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: public-site
          path: public-site/

      - id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.1

      # Sync files to the landing bucket. Set cache headers:
      # - Hashed assets (js/css): 1 year immutable cache
      # - Static assets (images, icons, manifest): 30 day cache
      # - HTML files: no-cache (always revalidate)
      - name: Upload to GCS
        run: |
          BUCKET="${{ secrets.GCP_TEACHING_PROJECT_ID }}-landing"

          # Upload hashed assets with aggressive caching
          gsutil -m -h "Cache-Control:public, max-age=31536000, immutable" \
            rsync -r -x '.*\.html$' public-site/assets/ "gs://${BUCKET}/assets/"

          # Upload static assets (images, icons, manifest)
          gsutil -m -h "Cache-Control:public, max-age=2592000" \
            cp public-site/*.png public-site/*.ico public-site/*.webmanifest "gs://${BUCKET}/"

          # Upload HTML files with no-cache
          gsutil -m -h "Cache-Control:no-cache" \
            cp public-site/*.html "gs://${BUCKET}/"

      - name: Verify deployment
        run: |
          BUCKET="${{ secrets.GCP_TEACHING_PROJECT_ID }}-landing"
          echo "Checking bucket contents..."
          gsutil ls "gs://${BUCKET}/"
          gsutil ls "gs://${BUCKET}/assets/"
