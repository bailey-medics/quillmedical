# Deploy public marketing site to the GCS landing bucket.
#
# Builds the public_pages Vite workspace once and syncs it to the app
# project's landing bucket, which serves the apex quill-medical.com domain.
# The bucket name is derived from the project id as `<project>-landing`, so
# changing the secret changes the target.
name: Deploy public site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/public_pages/**"
      - "frontend/public/**"
      - "frontend/src/components/**"
      - "frontend/src/theme.ts"
      # theme.ts reads its colours from here, so a colour change is a
      # site change too.
      - "shared/brand.yaml"
      - "frontend/src/styles/**"
      # How the site is deployed, not just what is in it. Without these a
      # change to the upload script sat unused until some unrelated content
      # change happened to trigger a run.
      - ".github/scripts/public-site/**"
      - ".github/workflows/public-site.yml"

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-public-site
  cancel-in-progress: true

jobs:
  build:
    name: Build public pages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Build public pages
        working-directory: frontend
        run: yarn workspace public-pages build

      - name: Upload public site
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-site
          path: frontend/dist/public_pages/

  deploy:
    name: Deploy to app
    runs-on: ubuntu-24.04
    needs: build
    # The environment that holds the GCP_APP_* secrets read below, and the
    # only one infra/github/environments.tf manages. It deploys from main
    # only. This job ran under `teaching` until October 2026, an environment
    # with no secrets of its own, so it was reading the repository-level
    # copies and recording its deployments against a retired name.
    environment:
      name: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download public site
        uses: actions/download-artifact@v8.0.1
        with:
          name: public-site
          path: public-site/

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_APP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Upload to GCS
        run: bash .github/scripts/public-site/deploy-to-gcs.sh "${{ secrets.GCP_APP_PROJECT_ID }}"

      - name: List deployed files
        run: bash .github/scripts/public-site/list-files.sh "${{ secrets.GCP_APP_PROJECT_ID }}"

  notify-failure:
    name: Notify public site deploy failure
    needs: [build, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Public site deploy failed*

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
