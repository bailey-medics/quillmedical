# Deploy public marketing site to the GCS landing bucket.
# Builds the public_pages Vite workspace once and syncs it to the teaching
# project's landing bucket, which serves the apex quill-medical.com domain.
name: Deploy public site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/public_pages/**"
      - "frontend/public/**"
      - "frontend/src/components/**"
      - "frontend/src/theme.ts"
      - "frontend/src/styles/**"

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-public-site
  cancel-in-progress: true

jobs:
  build:
    name: Build public pages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Build public pages
        working-directory: frontend
        run: yarn workspace public-pages build

      - name: Upload public site
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-site
          path: frontend/dist/public_pages/

  deploy-teaching:
    name: Deploy to teaching
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: teaching

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download public site
        uses: actions/download-artifact@v8.0.1
        with:
          name: public-site
          path: public-site/

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Upload to GCS
        run: bash .github/scripts/public-site/deploy-to-gcs.sh "${{ secrets.GCP_TEACHING_PROJECT_ID }}"

      - name: List deployed files
        run: bash .github/scripts/public-site/list-files.sh "${{ secrets.GCP_TEACHING_PROJECT_ID }}"

  notify-teaching-failure:
    name: Notify teaching deploy failure
    needs: [build, deploy-teaching]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy-teaching.result == 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Public site deploy failed*

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
