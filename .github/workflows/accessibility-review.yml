# Yearly reminder to review the accessibility statement.
#
# The Public Sector Bodies Accessibility Regulations 2018 require the
# statement at /accessibility-statement to be reviewed at least once a year
# and to say when it last was. NHS organisations that buy Quill are bound by
# them, so a statement left to go stale is a finding against them.
#
# Schedule: every Monday at 08:00 UTC, all year, because the review can
# happen in any month and the due date moves with it. Each run checks the
# REVIEWED date in the statement itself and sends nothing unless it is 11
# months old or more, so moving that date after a review is what
# stops the reminders. Until then they repeat weekly, by email and Slack,
# because one message a year is easy to miss.
name: Accessibility statement review

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Send the reminder whatever the review date, to check the email and
          Slack message arrive.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # Workload Identity Federation, to start the admin job

concurrency:
  group: accessibility-review
  cancel-in-progress: true

env:
  RECIPIENT: mark@quill-medical.com
  GCP_REGION: europe-west2

jobs:
  check:
    name: Is the review due?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
      reviewed: ${{ steps.check.outputs.reviewed }}
      due_by: ${{ steps.check.outputs.due_by }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the statement's review date
        id: check
        run: bash .github/scripts/accessibility-review/statement-review.sh "${{ inputs.force || 'false' }}"

  email:
    name: Email the reminder
    needs: check
    if: ${{ needs.check.outputs.due == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_APP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      # The app sends the email, not this workflow. The admin job renders
      # it in Quill's own layout and sends it with the app's mail key,
      # which never leaves the app: GitHub may start the job and nothing
      # more. This workflow used to read that key from Secret Manager and
      # send the email itself, which made GitHub a holder of a credential
      # it did not need.
      #
      # The dates go by the environment, never spliced into the script,
      # and `^|^` makes `|` the separator so that nothing in a value can
      # start another variable. The job checks each value again.
      - name: Run the reminder action on the admin job
        env:
          GCP_PROJECT: ${{ secrets.GCP_APP_PROJECT_ID }}
          REVIEWED: ${{ needs.check.outputs.reviewed }}
          DUE_BY: ${{ needs.check.outputs.due_by }}
        run: |
          gcloud run jobs execute quill-admin-app \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --update-env-vars="^|^ADMIN_ACTION=accessibility-reminder|ACCESSIBILITY_RECIPIENT=${RECIPIENT}|ACCESSIBILITY_REVIEWED=${REVIEWED}|ACCESSIBILITY_DUE_BY=${DUE_BY}" \
            --wait

  slack:
    name: Post the reminder to Slack
    needs: check
    if: ${{ needs.check.outputs.due == 'true' }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: app
      text: |
        *📋 Accessibility statement review due by ${{ needs.check.outputs.due_by }}*

        The regulations require a yearly review of
        https://quill-medical.com/accessibility-statement (last reviewed
        ${{ needs.check.outputs.reviewed }}). Check it is still true, then move
        the REVIEWED date in accessibility-statement.tsx and deploy the public
        site; that stops these reminders. The checklist is in the email to
        mark@quill-medical.com.
    secrets: inherit
