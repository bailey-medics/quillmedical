# Terraform: plan every live environment on PRs, apply each on merge to main.
#
# The environments are a matrix rather than a job apiece, so adding or retiring
# one is an edit to a single list. Staging and production are not in it: both
# were spun down to save GCP costs, and their tfvars are kept for a restore.
#
# `teaching` and `app` are the same product in two projects while it moves
# between them. `teaching` comes out of the matrix in Batch 8 of
# docs/docs/plans/2026-09-18-environment-isolation-and-iap-plan.md, once the
# old project is retired.
name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/github/**"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/github/**"

permissions:
  contents: read
  id-token: write       # Workload Identity Federation
  pull-requests: write
  actions: read         # Resolve the plan job's URL for the PR comment

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Terraform plan (PRs only) ----------
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    strategy:
      # One environment's plan failing should not hide the other's.
      fail-fast: false
      matrix:
        environment: [teaching, app]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets[format('GCP_{0}_WIF_PROVIDER', matrix.environment)] }}
          service_account: ${{ secrets[format('GCP_{0}_SERVICE_ACCOUNT', matrix.environment)] }}

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select -or-create ${{ matrix.environment }}

      - name: Terraform plan
        working-directory: infra
        # The alerting secrets are no longer passed in here: Terraform reads
        # them from Secret Manager. The service account authenticated above
        # already has access.
        run: |
          terraform plan \
            -var-file=environments/${{ matrix.environment }}/terraform.tfvars \
            -input=false \
            -no-color \
            2>&1 | tee plan-output.txt

      - name: Post plan to PR
        env:
          GH_TOKEN: ${{ github.token }}
          # Must match this job's `name:` above, with the matrix value
          # substituted. The runner only exposes the job's config key, so the
          # script looks the job up by display name to link straight at its
          # log. A mismatch links to the run instead.
          JOB_NAME: Plan (${{ matrix.environment }})
        run: bash .github/scripts/terraform/post-plan-comment.sh "${{ github.event.pull_request.number }}"

  # ---------- Terraform apply (main branch) ----------
  apply:
    name: Apply (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: ${{ matrix.environment }}
    strategy:
      # Never in parallel: both environments share one state bucket, and a
      # failure in one should not leave the other half-applied alongside it.
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: [teaching, app]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets[format('GCP_{0}_WIF_PROVIDER', matrix.environment)] }}
          service_account: ${{ secrets[format('GCP_{0}_SERVICE_ACCOUNT', matrix.environment)] }}

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select -or-create ${{ matrix.environment }}

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply \
            -var-file=environments/${{ matrix.environment }}/terraform.tfvars \
            -input=false \
            -auto-approve

  # ---------- Notify: apply failure ----------
  notify-teaching-failure:
    name: Notify failure (terraform)
    needs: apply
    if: ${{ failure() }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Terraform apply failed*

        *Author:* ${{ github.actor }}
        *SHA:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
