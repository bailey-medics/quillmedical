# Terraform: plan teaching on PRs, apply teaching on merge to main.
# Staging and production are no longer wired into CI — both were spun down to
# save GCP costs.
name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/github/**"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/github/**"

permissions:
  contents: read
  id-token: write       # Workload Identity Federation
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Terraform plan (PRs only) ----------
  plan:
    name: Plan (teaching)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select teaching

      - name: Terraform plan
        working-directory: infra
        run: |
          terraform plan \
            -var-file=environments/teaching/terraform.tfvars \
            -input=false \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan-output.txt

      - name: Post plan to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/terraform/post-plan-comment.sh "${{ github.event.pull_request.number }}"

  # ---------- Terraform apply: teaching (main branch) ----------
  apply-teaching:
    name: Apply (teaching)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: teaching
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select teaching

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply \
            -var-file=environments/teaching/terraform.tfvars \
            -input=false \
            -auto-approve

  # ---------- Notify: teaching apply failure ----------
  notify-teaching-failure:
    name: Notify failure (teaching)
    needs: apply-teaching
    if: ${{ failure() }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Terraform apply failed (teaching)*

        *Author:* ${{ github.actor }}
        *SHA:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
