# Unified build-once-promote deployment pipeline.
# Teaching: auto-deploys on merge to main.
# Production: promotes the SAME image via GitHub Environment approval gate.
#            Currently OFFLINE to save GCP costs (promote-to-production has
#            `if: false`). Remove that guard to re-enable production.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "safety/**"
      - ".github/prompts/**"
  workflow_dispatch:
    inputs:
      manual_commit:
        description: "Commit to build and deploy (also accepts a branch or tag — for hotfixes)"
        required: false
        default: ""

permissions:
  contents: write  # Needed for annotated tag creation
  id-token: write  # Workload Identity Federation for Google Cloud Platform

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a deploy in progress

env:
  GCP_REGION: europe-west2
  AR_REGISTRY: europe-west2-docker.pkg.dev
  VITE_VAPID_PUBLIC: BC0B26JO27tGc5qkbt2-QzY8M7_0u3gt5hmFj1RGWvZp9Vr9fDQ3-lpQ6YxqNlU0fFKlIUzCnb-baAE0rzIL-Ys

jobs:
  # ---------- Work out which commit to build ----------
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      backend_changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend_changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      services: ${{ github.event_name == 'workflow_dispatch' && '["backend","frontend"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Work out which commit to build
        id: resolve
        env:
          MANUAL_COMMIT: ${{ inputs.manual_commit }}
        run: bash .github/scripts/deploy/resolve-commit.sh

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "shared/**"
            frontend:
              - "frontend/**"
              - "shared/**"

  # ---------- Build and push Docker images ----------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    needs: prepare
    if: ${{ needs.prepare.outputs.services != '[]' }}
    environment: teaching
    strategy:
      matrix:
        # One leg per changed service (JSON array from the prepare job).
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Checkout teaching-tooling
        if: ${{ matrix.service == 'backend' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: bailey-medics/teaching-tooling
          path: teaching-tooling

      - name: Authenticate to GCP (teaching)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_TEACHING_PROJECT_ID }}/quill/${{ matrix.service }}:${{ needs.prepare.outputs.sha }}
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_TEACHING_PROJECT_ID }}/quill/${{ matrix.service }}:latest
          build-args: |
            VITE_VAPID_PUBLIC=${{ env.VITE_VAPID_PUBLIC }}
            VITE_CLINICAL_SERVICES_ENABLED=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Deploy to teaching ----------
  deploy-teaching:
    name: Deploy to teaching
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: always() && !failure() && !cancelled()
    environment: teaching
    steps:
      - name: Authenticate to GCP (teaching)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy backend
        if: ${{ needs.prepare.outputs.backend_changed == 'true' }}
        run: |
          gcloud run services update quill-backend-teaching \
            --project=${{ secrets.GCP_TEACHING_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets.GCP_TEACHING_PROJECT_ID }}/quill/backend:${{ needs.prepare.outputs.sha }}

      - name: Deploy frontend
        if: ${{ needs.prepare.outputs.frontend_changed == 'true' }}
        run: |
          gcloud run services update quill-frontend-teaching \
            --project=${{ secrets.GCP_TEACHING_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets.GCP_TEACHING_PROJECT_ID }}/quill/frontend:${{ needs.prepare.outputs.sha }}

      # Checkout only needed here so the smoke-test script is on the runner.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Smoke test
        run: bash .github/scripts/deploy/smoke-test.sh "https://teaching.quill-medical.com/api/health"

  # ---------- Promote to production ----------
  # NOTE: Production (clinical) environment is currently offline to save GCP costs.
  # Remove `if: false` when production is re-enabled.
  # TODO: Decouple production promotion from the per-push flow before re-enabling.
  # Chaining it onto `deploy-teaching` treats promotion as an automatic consequence
  # of every merge to main (= staging). Production should be a deliberate,
  # CSO-signed event — make it manual (workflow_dispatch choosing a commit/tag) or
  # tag-triggered, not automatic per push. See todo.md.
  # TODO: human review of prompt-to-production job
  promote-to-production:
    if: false
    name: Promote to production
    runs-on: ubuntu-24.04
    needs: [prepare, deploy-teaching]
    # Only runs after teaching succeeds; requires manual approval via environment
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Authenticate to GCP (teaching — source registry)
        id: auth-teaching
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_TEACHING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TEACHING_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate to GCP (production — target registry)
        id: auth-prod
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Install gcrane
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - gcrane
          chmod +x gcrane
          sudo mv gcrane /usr/local/bin/

      - name: Copy images to production registry
        run: |
          SRC_REGISTRY="${{ env.AR_REGISTRY }}/${{ secrets.GCP_TEACHING_PROJECT_ID }}/quill"
          DST_REGISTRY="${{ env.AR_REGISTRY }}/${{ secrets.GCP_PROD_PROJECT_ID }}/quill"
          SHA="${{ needs.prepare.outputs.sha }}"

          # Configure credentials for both registries
          echo '${{ steps.auth-teaching.outputs.access_token }}' | \
            gcrane auth login "${{ env.AR_REGISTRY }}" --username=oauth2accesstoken --password-stdin

          if [ "${{ needs.prepare.outputs.backend_changed }}" = "true" ]; then
            echo "Copying backend image..."
            gcrane copy "${SRC_REGISTRY}/backend:${SHA}" "${DST_REGISTRY}/backend:${SHA}"
            gcrane copy "${SRC_REGISTRY}/backend:${SHA}" "${DST_REGISTRY}/backend:latest"
          fi

          if [ "${{ needs.prepare.outputs.frontend_changed }}" = "true" ]; then
            echo "Copying frontend image..."
            gcrane copy "${SRC_REGISTRY}/frontend:${SHA}" "${DST_REGISTRY}/frontend:${SHA}"
            gcrane copy "${SRC_REGISTRY}/frontend:${SHA}" "${DST_REGISTRY}/frontend:latest"
          fi

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy backend to production
        if: ${{ needs.prepare.outputs.backend_changed == 'true' }}
        run: |
          gcloud run services update quill-backend-prod \
            --project=${{ secrets.GCP_PROD_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets.GCP_PROD_PROJECT_ID }}/quill/backend:${{ needs.prepare.outputs.sha }}

      - name: Deploy frontend to production
        if: ${{ needs.prepare.outputs.frontend_changed == 'true' }}
        run: |
          gcloud run services update quill-frontend-prod \
            --project=${{ secrets.GCP_PROD_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets.GCP_PROD_PROJECT_ID }}/quill/frontend:${{ needs.prepare.outputs.sha }}

      - name: Smoke test production
        run: bash .github/scripts/deploy/smoke-test.sh "https://app.quill-medical.com/api/health"

      - name: Create CalVer tag
        run: |
          YEAR_MONTH=$(date -u +"%Y.%m")
          # Find latest tag matching this month
          LATEST=$(git tag -l "${YEAR_MONTH}.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT_TAG="${YEAR_MONTH}.0"
          else
            PATCH=$(echo "$LATEST" | awk -F. '{print $3}')
            NEXT_TAG="${YEAR_MONTH}.$((PATCH + 1))"
          fi
          echo "Creating tag: $NEXT_TAG"
          git tag -a "$NEXT_TAG" "${{ needs.prepare.outputs.sha }}" \
            -m "Approved-by: ${{ github.actor }}
          Approved-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Safety-review: routine"
          git push origin "$NEXT_TAG"

  # ---------- Slack notifications ----------
  notify-teaching-failure:
    name: Notify teaching deploy failure
    needs: [prepare, build, deploy-teaching]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.build.result == 'failure' || needs.deploy-teaching.result == 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Teaching deploy failed*

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit

  notify-production-failure:
    name: Notify production promotion failure
    needs: promote-to-production
    if: ${{ always() && needs.promote-to-production.result == 'failure' }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Production promotion failed*

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
