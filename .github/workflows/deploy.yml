# Build and deploy on merge to main.
# App:        the only environment, and it auto-deploys. Teaching, staging
#             and production were retired in Batches 8 and 10a of
#             docs/docs/plans/2026-09-18-environment-isolation-and-iap-plan.md.
# Production: the promote-to-production job, and the CalVer tag it made,
#             went with the production project. A clinical (ehr) environment
#             gets its own promotion step when it exists, a deliberate one
#             rather than a consequence of every merge.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "safety/**"
      - ".github/prompts/**"
  workflow_dispatch:
    inputs:
      manual_commit:
        description: "Commit to build and deploy (also accepts a branch or tag — for hotfixes)"
        required: false
        default: ""

permissions:
  # Read only: write was for the CalVer tag, which went with the
  # promote-to-production job.
  contents: read
  id-token: write  # Workload Identity Federation for Google Cloud Platform

concurrency:
  # Fixed group (not keyed on github.ref) so a workflow_dispatch from a tag/hotfix
  # branch still serialises against a push-triggered deploy from main.
  group: deploy
  cancel-in-progress: false  # Never cancel a deploy in progress

env:
  GCP_REGION: europe-west2
  AR_REGISTRY: europe-west2-docker.pkg.dev
  VITE_VAPID_PUBLIC: BC0B26JO27tGc5qkbt2-QzY8M7_0u3gt5hmFj1RGWvZp9Vr9fDQ3-lpQ6YxqNlU0fFKlIUzCnb-baAE0rzIL-Ys

jobs:
  # ---------- Work out which commit to build ----------
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      backend_changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend_changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      services: ${{ github.event_name == 'workflow_dispatch' && '["backend","frontend"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Work out which commit to build
        id: resolve
        env:
          MANUAL_COMMIT: ${{ inputs.manual_commit }}
        run: bash .github/scripts/deploy/resolve-commit.sh

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "shared/**"
            # `caddy/` sits outside `frontend/` but is built into its
            # image: the prod stage copies `caddy/prod/Caddyfile`, which
            # is why this Dockerfile takes the repository root as its
            # build context. Without it listed here a Caddy-only change
            # skips the build, deploys nothing, and reports success —
            # which is how a CSP fix reached `main` and never reached
            # production. Every security header the app serves lives in
            # that file, so the failure is silent and security-shaped.
            frontend:
              - "frontend/**"
              - "shared/**"
              - "caddy/**"

  # ---------- Build and push Docker images ----------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    needs: prepare
    if: ${{ needs.prepare.outputs.services != '[]' }}
    environment: app
    strategy:
      matrix:
        # One leg per changed service (JSON array from the prepare job).
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Authenticates as the app project. The teaching project was
      # retired on 2026-09-23 and its registry went with it, so images
      # are pushed to one registry now rather than two.
      - name: Authenticate to GCP (app)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_APP_WIF_PROVIDER }}
          # The deploy account: pushes images and deploys Cloud Run, and
          # nothing else. The Terraform account, which can grant itself any
          # role, is kept out of the job that runs on every merge. Batch 9
          # Phase 1 of the environment isolation plan.
          service_account: ${{ secrets.GCP_APP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/${{ matrix.service }}:${{ needs.prepare.outputs.sha }}
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/${{ matrix.service }}:latest
          build-args: |
            VITE_VAPID_PUBLIC=${{ env.VITE_VAPID_PUBLIC }}
            VITE_CLINICAL_SERVICES_ENABLED=false
            VITE_APP_VERSION=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin image
        if: ${{ matrix.service == 'backend' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          target: admin
          push: true
          tags: |
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/admin:${{ needs.prepare.outputs.sha }}
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push transcode image
        if: ${{ matrix.service == 'backend' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          target: transcode
          push: true
          tags: |
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/transcode:${{ needs.prepare.outputs.sha }}
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/transcode:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Its own Dockerfile, not a target: Whisper pulls torch, which has
      # no business in the image the API serves from. Expect this step to
      # be the slow one in the build job.
      - name: Build and push caption image
        if: ${{ matrix.service == 'backend' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile.caption
          push: true
          tags: |
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/caption:${{ needs.prepare.outputs.sha }}
            ${{ env.AR_REGISTRY }}/${{ secrets.GCP_APP_PROJECT_ID }}/quill/caption:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Deploy to teaching ----------
  deploy:
    name: Deploy to ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    # A healthy run finishes in a few minutes. The ceiling stops a stalled
    # Cloud Run operation from holding the serialised deploy queue for an
    # hour, as one did on 2026-09-10 (run 34497127303).
    timeout-minutes: 30
    needs: [prepare, build]
    if: always() && !failure() && !cancelled()
    environment: ${{ matrix.environment }}
    strategy:
      # Never in parallel. Both deploys run the same migrations against
      # their own database, and serialising keeps one failure from landing
      # half a release in each project.
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: [app]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # actions/checkout must run before auth — it cleans $GITHUB_WORKSPACE,
      # which would otherwise wipe the credential file auth just wrote there.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets[format('GCP_{0}_WIF_PROVIDER', matrix.environment)] }}
          # The deploy account, as in the build job above.
          service_account: ${{ secrets[format('GCP_{0}_DEPLOY_SERVICE_ACCOUNT', matrix.environment)] }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Which services are still on the placeholder image, and so need
      # deploying whatever the paths filter decided. See the script for why
      # that filter cannot answer this on its own.
      - name: Find services still on the placeholder image
        id: placeholder
        run: |
          bash .github/scripts/deploy/find-placeholder-services.sh \
            ${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }} \
            ${{ env.GCP_REGION }} \
            ${{ matrix.environment }}

      # Runs once against the shared core DB, before the new backend revision
      # is created — removes the multi-instance migration race and gives a
      # clean pass/fail signal separate from app boot (see
      # docs/docs/backend/alembic-migration-safety.md).
      - name: Run database migrations
        if: ${{ needs.prepare.outputs.backend_changed == 'true' || steps.placeholder.outputs.backend == 'true' }}
        run: |
          bash .github/scripts/deploy/run-migrations.sh \
            quill-admin-${{ matrix.environment }} \
            ${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }} \
            ${{ env.GCP_REGION }} \
            ${{ env.AR_REGISTRY }}/${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }}/quill/admin:${{ needs.prepare.outputs.sha }}

      # A Cloud Run job cannot be created without naming some image, and at
      # `terraform apply` time ours has not been built yet — so every image
      # variable in this repository starts as `gcr.io/cloudrun/hello` and CI
      # replaces it. The job module sets `ignore_changes` on the image so a
      # later apply does not revert what CI put there.
      #
      # This step is the replacement half, and until now it was missing for
      # the transcode job alone: backend and frontend are replaced below,
      # admin by run-migrations.sh, and transcode by nothing — so it has
      # been running Google's hello-world container since the day it was
      # created, looking perfectly healthy in the console.
      #
      # `jobs update`, not `jobs execute --image` — there is no such flag,
      # and the Python client's ContainerOverride carries name, args, env
      # and clear_args but no image, so the image cannot be chosen per
      # execution. It is a property of the job, set here once per deploy.
      - name: Point the transcode job at this build
        if: ${{ needs.prepare.outputs.backend_changed == 'true' || steps.placeholder.outputs.backend == 'true' }}
        run: |
          gcloud run jobs update quill-transcode-${{ matrix.environment }} \
            --project=${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }}/quill/transcode:${{ needs.prepare.outputs.sha }}

      # The caption image is built from its own Dockerfile rather than a
      # target of the shared one, because Whisper pulls torch and has no
      # business in the image the API serves from. It is pointed at the
      # same way regardless.
      - name: Point the caption job at this build
        if: ${{ needs.prepare.outputs.backend_changed == 'true' || steps.placeholder.outputs.backend == 'true' }}
        run: |
          gcloud run jobs update quill-caption-${{ matrix.environment }} \
            --project=${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }}/quill/caption:${{ needs.prepare.outputs.sha }}

      # The smoke test runs inside the admin job rather than from this
      # runner, because a tagged revision's *.run.app URL is only reachable
      # from the VPC once the backend's ingress is closed. Unset, the
      # script falls back to curl; see run_smoke_test in deploy-tagged.sh.
      - name: Deploy backend
        if: ${{ needs.prepare.outputs.backend_changed == 'true' || steps.placeholder.outputs.backend == 'true' }}
        env:
          SMOKE_TEST_JOB: quill-admin-${{ matrix.environment }}
          SMOKE_TEST_PROJECT: ${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }}
          SMOKE_TEST_REGION: ${{ env.GCP_REGION }}
        run: |
          SHA="${{ needs.prepare.outputs.sha }}"
          # Cloud Run caps combined tag + service name at 46 chars, so a
          # full 40-char SHA won't fit alongside the service name.
          bash .github/scripts/deploy/deploy-tagged.sh \
            quill-backend-${{ matrix.environment }} \
            ${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }} \
            ${{ env.GCP_REGION }} \
            ${{ env.AR_REGISTRY }}/${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }}/quill/backend:${SHA} \
            "rev-${SHA:0:12}" \
            /api/health

      - name: Deploy frontend
        if: ${{ needs.prepare.outputs.frontend_changed == 'true' || steps.placeholder.outputs.frontend == 'true' }}
        run: |
          gcloud run services update quill-frontend-${{ matrix.environment }} \
            --project=${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.AR_REGISTRY }}/${{ secrets[format('GCP_{0}_PROJECT_ID', matrix.environment)] }}/quill/frontend:${{ needs.prepare.outputs.sha }}

      # Public-edge check, complementing (not replacing) the tagged-revision
      # smoke test above — confirms the live edge is serving correctly too.
      - name: Smoke test
        env:
          HOSTNAME: app.quill-medical.com
        run: bash .github/scripts/deploy/smoke-test.sh "https://${HOSTNAME}/api/health"

  # ---------- Slack notifications ----------
  notify-deploy-failure:
    name: Notify deploy failure
    needs: [prepare, build, deploy]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      channel: teaching
      text: |
        *❌ Deploy failed*

        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        *Author:* ${{ github.actor }}
        *Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
    secrets: inherit
