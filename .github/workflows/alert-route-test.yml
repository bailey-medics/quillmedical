# Four-weekly test of every alert route: Slack, SMS, email and a phone call.
#
# Writes one line to the alert-route-test log, and four permanent alert
# policies in infra/modules/monitoring each notify one channel from it. On
# 2026-09-23 two routes had broken silently while Google reported their
# alerts as raised, so the only real test is a person noticing a missing
# message.
#
# Schedule: every fourth Thursday at 1:15pm UK time, from 2026-10-01. Cron
# can express neither half, so this fires every Thursday at both UTC times
# that can be 1:15pm in London, and alert-route-test.sh keeps exactly one of
# them in a test week and neither otherwise.
name: Alert route test

on:
  schedule:
    - cron: "15 12 * * 4" # 1:15pm in London during summer time
    - cron: "15 13 * * 4" # 1:15pm in London during winter time
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: alert-route-test
  cancel-in-progress: false

jobs:
  fire:
    name: Fire every alert route
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # The app project's CI account, until Batch 9 of
      # docs/docs/plans/2026-09-18-environment-isolation-and-iap-plan.md
      # gives this job an identity holding roles/logging.logWriter and
      # nothing else. Writing one log line is the narrowest thing any CI
      # job does here.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_APP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Fire the routes
        env:
          GCP_PROJECT: ${{ secrets.GCP_APP_PROJECT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/monitoring/alert-route-test.sh
