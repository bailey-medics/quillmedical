# Automatically create a pull request when a hotfix/* or feature/* branch is pushed.
# Also labels PRs based on branch prefix.

name: Create pull request

on:
  push:
    branches:
      - "hotfix/**"
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/auto-pr/create-pr.sh "$GITHUB_REF_NAME"

      - name: Label PR by branch prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/auto-pr/label-pr.sh "$GITHUB_REF_NAME"
