# Run the teaching reminders by hand: a report, or a real run when asked.
#
# Two kinds of email, both promised in the privacy policy and the terms: a
# reminder to somebody enrolled on a module who has not finished an
# attempt, on the schedule the module sets in its own module.yaml, and a
# notice to somebody whose pass is due to be repeated.
# backend/app/features/teaching/reminders.py decides who is due, as the
# `send-teaching-reminders` action on the admin job.
#
# **This does not run on a timer.** Cloud Scheduler starts the morning run,
# from infra/scheduled-jobs.tf. It began here, as a scheduled workflow, and
# was moved: GitHub's schedule is best effort, and nothing in the
# repository decides who is due.
#
# What is left is the button. Start it from the Actions tab to see how
# many of each would go. It sends nothing unless `apply` is ticked, which
# is for sending again after a failed morning. What was already sent is
# recorded, so nobody is sent one twice.
#
# The app sends the email, and not this workflow, so that GitHub holds no
# mail credential and no database credential: it only starts the job.
name: Teaching reminders

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Send what is due. Unticked, it only counts.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # Workload Identity Federation, to start the admin job

concurrency:
  group: teaching-reminders
  cancel-in-progress: false

env:
  GCP_REGION: europe-west2

jobs:
  reminders:
    name: Send teaching reminders
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_APP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Run the reminders action on the admin job
        env:
          GCP_PROJECT: ${{ secrets.GCP_APP_PROJECT_ID }}
          # A report unless `apply` was ticked.
          APPLY: ${{ inputs.apply }}
        run: |
          gcloud run jobs execute quill-admin-app \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --update-env-vars="^|^ADMIN_ACTION=send-teaching-reminders|REMINDERS_APPLY=${APPLY}" \
            --wait
