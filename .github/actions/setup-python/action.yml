name: Set up Python
description: >-
  Install Python (pinned via .python-version) and, optionally, Poetry plus the
  backend dependencies, with the Poetry download cache. Toggle each stage with
  the inputs so both Poetry and non-Poetry jobs can reuse this action.

inputs:
  install-poetry:
    description: Install Poetry (in-project venvs), cache its downloads, and install backend deps.
    default: "true"
  cache-key-prefix:
    description: Namespace for the Poetry download cache key.
    default: "poetry"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version-file: .python-version

    # backend/.venv is intentionally NOT cached: it symlinks into the ephemeral
    # Python toolcache, and a restored copy segfaults when that interpreter is
    # rebuilt. Cache Poetry's download cache so `poetry install` stays fast.
    - name: Cache Poetry & pip
      if: inputs.install-poetry == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-py${{ hashFiles('.python-version') }}-
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-

    - name: Install Poetry
      if: inputs.install-poetry == 'true'
      shell: bash
      run: |
        python -m pip install -U pip poetry
        poetry config virtualenvs.in-project true

    - name: Install backend deps
      if: inputs.install-poetry == 'true'
      shell: bash
      working-directory: backend
      run: poetry install --with dev --no-interaction --no-ansi
