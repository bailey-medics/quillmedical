name: Set up Python
description: >-
  Set up Python (pinned via .python-version). Optionally install Poetry with an
  in-project venv, cache Poetry's downloads, and install the backend
  dependencies (set install-backend-deps: false for Python-only callers).

inputs:
  install-backend-deps:
    description: >-
      Install Poetry and the backend dependencies (with the Poetry download
      cache). Set to false for callers that only need the Python interpreter.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version-file: .python-version

    # backend/.venv is intentionally NOT cached: it symlinks into the ephemeral
    # Python toolcache, and a restored copy segfaults when that interpreter is
    # rebuilt. Cache Poetry's download cache so `poetry install` stays fast.
    # One shared namespace: the key is content-addressed on poetry.lock + Python,
    # so all callers safely share the same downloads.
    - name: Cache Poetry & pip
      if: inputs.install-backend-deps == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: poetry-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-py${{ hashFiles('.python-version') }}-
          poetry-${{ runner.os }}-

    - name: Install Poetry
      if: inputs.install-backend-deps == 'true'
      shell: bash
      run: |
        python -m pip install -U pip poetry
        poetry config virtualenvs.in-project true

    - name: Install backend deps
      if: inputs.install-backend-deps == 'true'
      shell: bash
      working-directory: backend
      run: poetry install --with dev --no-interaction --no-ansi
