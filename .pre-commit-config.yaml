repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.0
    hooks:
      - id: black
        language_version: python3.14
        args: ["--config=backend/pyproject.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.2.0
    hooks:
      - id: cspell
        name: cspell (spelling checker)
        exclude: '^(.*/)?(yarn\.lock|\.yarn/.*|poetry\.lock)$'
        args:
          - --no-progress
          # - --no-summary
          - --config
          - cspell.config.json

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # alembic and sqlalchemy are pinned to backend/poetry.lock. Unpinned,
        # this environment took whatever PyPI had newest: SQLAlchemy 2.1.0,
        # released 2026-09-24, arrived through alembic's SQLAlchemy>=2.0 and
        # failed every PR on typing the locked 2.0.54 does not share. Bump
        # these together with the lock file, never one without the other.
        additional_dependencies:
          [
            alembic==1.20.0,
            sqlalchemy==2.0.54,
            types-requests,
            types-pyyaml,
            types-Markdown,
          ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (backend)
        args:
          - r
          - backend
          - -x
          - backend/tests
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-migrations
        name: check Alembic migrations
        entry: python3 backend/scripts/check_migrations.py --all
        language: system
        files: ^backend/alembic/versions/.*\.py$
        pass_filenames: false

      - id: check-api-schema-coverage
        name: check API schema coverage
        entry: env -u VIRTUAL_ENV poetry -C backend run python3 scripts/check_api_schema_coverage.py --all --dev
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scanning)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
