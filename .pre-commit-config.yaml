repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.0
    hooks:
      - id: black
        language_version: python3.14
        args: ["--config=backend/pyproject.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.2.0
    hooks:
      - id: cspell
        name: cspell (spelling checker)
        # The AWS policy files are lists of AWS's own service names. They
        # are in cspell.config.json's ignorePaths too, but a run handed
        # only ignored files checks none and fails, so they are kept from
        # the hook here as the lock files are.
        exclude: '^(.*/)?(yarn\.lock|\.yarn/.*|poetry\.lock)$|^infra/aws/policies/.*\.json$'
        args:
          - --no-progress
          # - --no-summary
          - --config
          - cspell.config.json

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # alembic and sqlalchemy are pinned to backend/poetry.lock. Unpinned,
        # this environment took whatever PyPI had newest: SQLAlchemy 2.1.0,
        # released 2026-09-24, arrived through alembic's SQLAlchemy>=2.0 and
        # failed every PR on typing the locked 2.0.54 does not share. Bump
        # these together with the lock file, never one without the other.
        additional_dependencies:
          [
            alembic==1.20.0,
            sqlalchemy==2.0.54,
            types-requests,
            types-pyyaml,
            types-Markdown,
            "boto3-stubs[sesv2]",
          ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      # Run through a script of ours and not straight from the hook, so
      # the script can check that the scan covered the backend. Bandit
      # passes a scan of nothing, and for a year this hook passed "r"
      # where "-r" was meant and scanned no lines. What is scanned, and
      # what is left out, is in the script.
      - id: bandit
        name: bandit (backend)
        entry: .github/scripts/ci/run-bandit.sh
        args: []
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-migrations
        name: check Alembic migrations
        entry: python3 backend/scripts/check_migrations.py --all
        language: system
        files: ^backend/alembic/versions/.*\.py$
        pass_filenames: false

      - id: check-api-schema-coverage
        name: check API schema coverage
        entry: env -u VIRTUAL_ENV poetry -C backend run python3 scripts/check_api_schema_coverage.py --all --dev
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

      # The list of email themes is generated from the brand file into
      # one Python and one TypeScript file, because neither type checker
      # can read YAML. This writes both whenever the brand file is in a
      # commit, and stages them. It comes before the previews are
      # rendered: those import the app, which refuses to load while the
      # generated names and the brand file disagree.
      - id: generate-email-themes
        name: generate email themes
        entry: sh -c 'env -u VIRTUAL_ENV poetry -C backend run python3 scripts/generate_email_themes.py && git add backend/app/email/theme.py frontend/src/generated/emailThemes.ts'
        language: system
        files: ^(shared/brand\.yaml|backend/scripts/generate_email_themes\.py)$
        pass_filenames: false

      # Storybook shows the committed renders of every email, and a test
      # fails in CI when they are behind the templates. This renders them
      # whenever something an email is made from is staged, and stages the
      # result, so the renders travel in the same commit as the change.
      # `git add` and not a failure for the author to act on: a stacked
      # commit that stops part-way is awkward to run again.
      - id: render-email-previews
        name: render email previews
        entry: sh -c 'env -u VIRTUAL_ENV poetry -C backend run python3 scripts/render_email_previews.py && git add frontend/src/stories/emails/rendered'
        language: system
        files: ^(backend/app/email/|backend/app/features/teaching/email_templates\.py$|shared/brand\.yaml$)
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scanning)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
