repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.13
        args: ["--config=backend/pyproject.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.7.0
    hooks:
      - id: cspell
        name: cspell (spelling checker)
        exclude: '^(.*/)?(yarn\.lock|\.yarn/.*|poetry\.lock)$'
        args:
          - --no-progress
          # - --no-summary
          - --config
          - cspell.config.json

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          [alembic, types-requests, types-pyyaml, types-Markdown]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (backend)
        args:
          - r
          - backend
          - -x
          - backend/tests
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-migrations
        name: check Alembic migrations
        entry: python3 backend/scripts/check_migrations.py --all
        language: system
        files: ^backend/alembic/versions/.*\.py$
        pass_filenames: false

      - id: check-api-schema-coverage
        name: check API schema coverage
        entry: poetry -C backend run python3 scripts/check_api_schema_coverage.py --all --dev
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scanning)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
