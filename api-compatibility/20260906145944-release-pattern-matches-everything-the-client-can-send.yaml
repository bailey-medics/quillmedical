change: "request-property-pattern-added POST /api/analytics/client-errors added the pattern `^[A-Za-z0-9._-]*$` to the request property `release`"
reason: 'The pattern admits everything any client can actually send. The browser fills release from the build constant __APP_VERSION__, which is either a full forty-character git revision or the literal "dev" — both already letters, digits and separators — so no existing or stale client is rejected by it. The constraint was added because the alternative was worse: release had been running through the prose redaction rules, and a git revision routinely contains a run of five or more digits, so the record-number rule replaced them and versions reached the logs mangled, differently each release. That defeated the point of recording which build a fault came from. Shape-checking replaces redaction, and the pattern is what makes it safe. Even in the case it is meant to catch, a caller posting a non-version-shaped release, the consequence is a rejected error report: the reporter is fire-and-forget by design, never surfaces a failure to the user, and drops what it cannot send. Nothing a person sees changes, so no open tab needs reloading.'
