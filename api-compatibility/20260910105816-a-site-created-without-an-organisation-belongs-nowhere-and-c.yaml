change: "new-required-request-property POST /api/sites added the new required request property `organisation_id`"
reason: "A site created without an organisation belongs nowhere and cannot be scoped afterwards: every site place check asks which organisation a site belongs to, and list_sites cannot show it. The route now links the site in the same transaction, so a site is never briefly ownerless — _require_site_in_own_org already assumed this was impossible when it called a site's organisation the site's owner, and now it is true. No open tab needs reloading. The only caller is the admin add-site page, which already knew the organisation from its own route parameter and merely did not send it; it previously created the site and linked it in a second request, so a failure between the two left a permanently ownerless record. A stale tab running the old two-call flow gets a 422 naming the missing field and creates nothing, which is the safe direction: the previous behaviour on that path was to leave an orphan."
