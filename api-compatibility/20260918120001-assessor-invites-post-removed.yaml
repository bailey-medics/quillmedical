change: "api-path-removed-without-deprecation POST /api/passport/{passport_id}/assessor-invites api path removed without deprecation"
reason: "Inviting an assessor by hand is superseded by asking for a sign-off, which now sends the same invitation as part of the ask. The old route required the holder to type the assessor's name, registering body and number on their behalf, and stored them on the invitation; the accept flow then built the new account from those fields. Asking for a sign-off collects an address and nothing else, so the assessor states their own name and registration when they register — a better source, since a number typed by its holder is worth more than one half-remembered by somebody else. Removed without deprecation because no released bundle calls it: the API client defined the function and no screen ever used it. The passport feature is off for every organisation, and both tables were empty when this shipped."
