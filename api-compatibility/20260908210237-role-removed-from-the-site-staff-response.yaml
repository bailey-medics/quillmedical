change: "response-required-property-removed GET /api/sites/{site_id} removed the required property `staff/items/role` from the response with the `200` status"
reason: 'The field named three unrelated things under one word, which is why every search for its consumers undercounted it. clinical_lead said who held the site''s clinical lead post; trainee said who was on placement there; staff said only that the person was a member, which the row already says by existing. Those are now three separate things: the post, carried in the same response as clinical_lead_id; the capacity column on site_member; and membership itself. Nothing is lost, and the one thing a caller could not previously express — a post that exists with nobody in it — is now expressible. No open tab needs reloading. The three admin site pages were moved onto clinical_lead_id in an earlier release and no longer read this field for anything; the only remaining use was a staff-and-trainee filter on the site page, deliberately dropped, since nothing in the backend ever compared staff and the useful half is trainee, which the capacity column keeps. A stale tab still holding the old page renders a staff table without a Role column and filters that no longer offer role options: it loses a column, it does not break, and nothing it can do produces a wrong result.'
