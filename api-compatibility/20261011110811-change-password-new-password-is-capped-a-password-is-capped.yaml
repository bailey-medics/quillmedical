change: "request-property-max-length-set POST /api/auth/change-password the `new_password` request property's maxLength was set to `128`"
reason: "Change password new password is capped. A password is capped at 128 characters, far longer than any passphrase, so that hashing one costs nothing worth noticing. The frontend's own inputs stop at the same number, and no real value is this long, so an open tab on an older build sends nothing that is now refused. The silent background update is enough. No forced reload."
