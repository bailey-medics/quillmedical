change: "request-property-max-length-set POST /api/auth/register the `username` request property's maxLength was set to `150`"
reason: "Register username is capped. A username is capped at 150 characters, the width of the users.username column, so a longer one could never have been stored. The frontend's own inputs stop at the same number, and no real value is this long, so an open tab on an older build sends nothing that is now refused. The silent background update is enough. No forced reload."
