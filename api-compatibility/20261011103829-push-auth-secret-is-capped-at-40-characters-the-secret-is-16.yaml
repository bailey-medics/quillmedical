reason: "Push auth secret is capped at 40 characters. The secret is 16 bytes, 22 characters of URL-safe base64. The frontend builds this request itself, in subscriptionBody, from the browser's own push subscription, and a real subscription is always inside this limit. An open tab on an older build sends the same value, taken from the same browser object. Nothing a real browser sends is refused, so the silent background update is enough. No forced reload."
