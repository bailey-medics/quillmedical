forces_reload: false
change: "response-required-property-removed GET /api/users/{user_id} removed the required property `organisation_ids` from the response with the `200` status"
reason: "Organisations and the places inside them are one table now, and this response says where somebody belongs once, in `place_ids`, rather than twice in two kinds of id. `place_ids` has been served alongside both older fields since the previous release, and the only client of this endpoint — the user form in this repository — moved onto it then. A stale tab does not break: it renders the two dropdowns from an empty list, which is what it already does when an admin can see no organisations, and saving from it sends `place_ids` because the bundle that reads this response is the bundle that writes it. No open tab needs reloading. The reason both fields go at once is that keeping either would mean keeping the organisations table they count against, which is the point of the change."
