reason: "Reset password token is capped. A token is capped at 2048 characters. The tokens issued here, in emailed links, are a few hundred. The frontend's own inputs stop at the same number, and no real value is this long, so an open tab on an older build sends nothing that is now refused. The silent background update is enough. No forced reload."
