change: "request-property-removed POST /api/passport/{passport_id}/cpd removed the request property `hours`"
reason: "CPD is measured in points, not hours, and the field is now named `points` in the React form, both API schemas and the on-disk record model. One point is one hour so no value changes, only the name. No open tab needs reloading and nothing can break: the passport feature is off for every organisation, no page is wired to any passport route, and this endpoint has never been called by a client. The rename was taken now precisely because that is true — the passport is unreleased, so this is the cheapest the change will ever be, and a field whose name disagrees with the word on screen is a trap for whoever reads the code next. There is no database column involved: CPD entries live in per-holder YAML files, so no migration was required."
