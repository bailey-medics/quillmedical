reason: "Totp verify code is capped. A one-time code is capped at 16 characters: six digits, with room for the spaces some authenticator apps show. The frontend's own inputs stop at the same number, and no real value is this long, so an open tab on an older build sends nothing that is now refused. The silent background update is enough. No forced reload."
