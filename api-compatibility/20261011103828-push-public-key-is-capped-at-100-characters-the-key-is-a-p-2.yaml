change: "request-property-max-length-set POST /api/push/subscribe the `keys/p256dh` request property's maxLength was set to `100`"
reason: "Push public key is capped at 100 characters. The key is a P-256 public key, 87 characters of URL-safe base64. The frontend builds this request itself, in subscriptionBody, from the browser's own push subscription, and a real subscription is always inside this limit. An open tab on an older build sends the same value, taken from the same browser object. Nothing a real browser sends is refused, so the silent background update is enough. No forced reload."
