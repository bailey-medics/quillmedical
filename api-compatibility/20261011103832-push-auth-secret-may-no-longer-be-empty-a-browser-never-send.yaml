change: "request-property-min-length-increased POST /api/push/subscribe the `keys/auth` request property's minLength was increased from `0` to `1`"
reason: "Push auth secret may no longer be empty. A browser never sends an empty secret, and a subscription without one could not be sent to. The frontend builds this request itself, in subscriptionBody, from the browser's own push subscription, and a real subscription is always inside this limit. An open tab on an older build sends the same value, taken from the same browser object. Nothing a real browser sends is refused, so the silent background update is enough. No forced reload."
