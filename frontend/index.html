<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Use Vite's %BASE_URL% so the asset paths respect `base` from vite.config.ts -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />

    <!-- PWA manifest + theme color -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />

    <!-- iOS standalone-mode support (Safari honours these alongside the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Medical</title>

    <!-- Set colour scheme before styles load to prevent flash. A file,
         not an inline script: the content security policy runs no
         script written inside the page. -->
    <script src="/colour-scheme.js"></script>
  </head>
  <body>
    <div id="root">
      <!--
        The quill, turning, for the wait before the app has loaded. React
        replaces everything in here on its first render, with a spinner
        that carries on from the same angle (see quillSpinnerClock.ts).

        It is a copy, by hand, of QuillSpinner and PageSpinner in
        src/components/loading-spinner, because none of the app exists
        yet to draw it. startUpSpinner.test.ts fails if the two differ.
        The colours are written out, since the theme that names them has
        not loaded either. No script: the content security policy runs
        none written inside the page.
      -->
      <style>
        /*
         * Mantine's stylesheet paints a dark page grey until the theme
         * arrives and makes it navy. Say navy from the start.
         */
        :root[data-mantine-color-scheme="dark"] {
          --mantine-color-body: #001a36;
        }

        /*
         * Mantine's stylesheet takes the browser's 8px off the body. In
         * development that stylesheet arrives with the scripts, partway
         * through the turn, and the quill would jump up to meet it.
         */
        body {
          margin: 0;
        }

        .quill-splash {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 60dvh;

          --quill-spinner-face: #001a36;
          --quill-spinner-lit: #6894c0;
          --quill-spinner-shadow: #000a17;
          --quill-spinner-turn: 2.4s;
          --quill-spinner-half-turn: calc(var(--quill-spinner-turn) / 2);
        }

        [data-mantine-color-scheme="dark"] .quill-splash {
          --quill-spinner-face: #245d8f;
          --quill-spinner-lit: #bdd2eb;
          --quill-spinner-shadow: #0a2f56;
        }

        .quill-splash-box {
          width: 8rem;
          height: 8rem;
        }

        .quill-splash-tilt,
        .quill-splash-spin {
          width: 100%;
          height: 100%;
          transform-origin: 19.918% 97.036%;
        }

        .quill-splash-tilt {
          transform: rotate(32.59deg);
        }

        .quill-splash-spin {
          position: relative;
          animation: quill-splash-turn var(--quill-spinner-turn) infinite;
          will-change: transform;
        }

        .quill-splash-layer {
          position: absolute;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
        }

        .quill-splash-face {
          fill: var(--quill-spinner-face);
        }

        .quill-splash-lit {
          fill: var(--quill-spinner-lit);
          opacity: 0;
          animation: quill-splash-lit var(--quill-spinner-half-turn) infinite;
          will-change: opacity;
        }

        .quill-splash-shadow {
          fill: var(--quill-spinner-shadow);
          opacity: 0;
          animation: quill-splash-shadow var(--quill-spinner-half-turn) infinite;
          will-change: opacity;
        }

        [data-mantine-color-scheme="dark"] .quill-splash-lit {
          animation-name: quill-splash-lit-late;
        }

        [data-mantine-color-scheme="dark"] .quill-splash-shadow {
          animation-name: quill-splash-shadow-late;
        }

        /* Heard by a screen reader, seen by nobody. */
        .quill-splash-status {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        @keyframes quill-splash-turn {
          0% {
            transform: scaleX(1);
            animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0);
          }

          25% {
            transform: scaleX(0);
            animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
          }

          50% {
            transform: scaleX(-1);
            animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0);
          }

          75% {
            transform: scaleX(0);
            animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
          }

          100% {
            transform: scaleX(1);
          }
        }

        @keyframes quill-splash-lit {
          0% {
            opacity: 0;
            animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
          }

          49.98% {
            opacity: 1;
          }

          50%,
          100% {
            opacity: 0;
          }
        }

        @keyframes quill-splash-shadow {
          0%,
          49.98% {
            opacity: 0;
          }

          50% {
            opacity: 1;
            animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0);
          }

          100% {
            opacity: 0;
          }
        }

        @keyframes quill-splash-lit-late {
          0% {
            opacity: 0;
            animation-timing-function: cubic-bezier(0.3, 0.1, 0.7, 0.7);
          }

          49.98% {
            opacity: 1;
          }

          50%,
          100% {
            opacity: 0;
          }
        }

        @keyframes quill-splash-shadow-late {
          0%,
          49.98% {
            opacity: 0;
          }

          50% {
            opacity: 1;
            animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0);
          }

          100% {
            opacity: 0;
          }
        }

        @keyframes quill-splash-pulse {
          0%,
          100% {
            opacity: 1;
          }

          50% {
            opacity: 0.35;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .quill-splash-spin,
          .quill-splash-lit,
          .quill-splash-shadow,
          [data-mantine-color-scheme="dark"] .quill-splash-lit,
          [data-mantine-color-scheme="dark"] .quill-splash-shadow {
            animation: none;
          }

          .quill-splash-tilt {
            animation: quill-splash-pulse 1.6s ease-in-out infinite;
          }
        }
      </style>
      <div class="quill-splash">
        <div class="quill-splash-box">
          <div class="quill-splash-tilt" aria-hidden="true">
            <div class="quill-splash-spin" id="quill-splash-spin">

                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 829.9 829.9"

                />
              </svg>
              <svg
                class="quill-splash-layer quill-splash-lit"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 829.9 829.9"
              >
                <use href="#quill-splash-outline" />
              </svg>
              <svg
                class="quill-splash-layer quill-splash-shadow"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 829.9 829.9"
              >
                <use href="#quill-splash-outline" />
              </svg>
            </div>
          </div>
          <span class="quill-splash-status" role="status">Loading</span>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
