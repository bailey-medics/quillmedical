<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Use Vite's %BASE_URL% so the asset paths respect `base` from vite.config.ts -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />

    <!-- PWA manifest + theme color -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />

    <!-- iOS standalone-mode support (Safari honours these alongside the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Medical</title>

    <!-- Set colour scheme before styles load to prevent flash -->
    <script>
      document.documentElement.setAttribute(
        "data-mantine-color-scheme",
        localStorage.getItem("mantine-color-scheme-value") || "light",
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
